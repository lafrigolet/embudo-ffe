<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Embudo de empresas FFE</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E6B5A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Embudo FFE"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: herramienta de trabajo. Cabecera + franja de resumen + tres vistas (tablero, lista, agenda) + ficha lateral + ventanas de configurar e importar. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunken:#E9EEEE; --ink:#14211F; --muted:#5B6B69; --line:#D6DFDE;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --cmp:#9DAEA7; --danger:#B42318; --danger-soft:#FDE8E6; --warn:#A35200; --warn-soft:#FFF0DC; --ok:#0B7A43; --ok-soft:#DFF3E7;
  --ramp-start:#B9C6C4; --ramp-end:#0E5A48; --closed:#9AA3A2;
  --shadow:0 1px 2px rgba(20,33,31,.06),0 4px 14px rgba(20,33,31,.06);
  --overlay:rgba(14,24,22,.35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#151D1C; --sunken:#1B2524; --ink:#E4ECEA; --muted:#93A6A2; --line:#283432;
  --accent:#4CC2A4; --accent-ink:#06231C; --accent-soft:#16332C;
  --cmp:#5C6E67; --danger:#FF8A7A; --danger-soft:#3A1A17; --warn:#F5B25C; --warn-soft:#352614; --ok:#5FD39A; --ok-soft:#12301F;
  --ramp-start:#4A5755; --ramp-end:#5FD3B2; --closed:#5E6867;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151D1C; --sunken:#1B2524; --ink:#E4ECEA; --muted:#93A6A2; --line:#283432;
  --accent:#4CC2A4; --accent-ink:#06231C; --accent-soft:#16332C;
  --cmp:#5C6E67; --danger:#FF8A7A; --danger-soft:#3A1A17; --warn:#F5B25C; --warn-soft:#352614; --ok:#5FD39A; --ok-soft:#12301F;
  --ramp-start:#4A5755; --ramp-end:#5FD3B2; --closed:#5E6867;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;margin:0 auto}

/* Cabecera */
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand .curso{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative}
.search input{width:220px;max-width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
select.sel,.m-body select,.m-body input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Aviso de ejemplo */
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13px;margin-bottom:12px}
.notice b{color:var(--warn)}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.stat:hover{border-color:var(--muted)}
.stat .n{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.stat.alert .n{color:var(--danger)}
.stat.today .n{color:var(--warn)}
.stat.good .n{color:var(--ok)}

/* Pestañas */
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;flex:none;padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-dd{position:relative;display:inline-flex}
.tab-dd .chev{font-size:15px;line-height:1;margin:-6px -8px -6px 0;padding:6px 8px 6px 5px;display:inline-block;transform:translateY(1px);border-radius:6px;cursor:pointer}
.tab-dd .chev:hover{background:var(--accent-soft);color:var(--accent)}.tab-dd > a.solo .chev{display:none}.tab-dd[hidden]{display:none}
.pmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg,0 8px 24px rgba(0,0,0,.14));padding:4px;min-width:190px;display:flex;flex-direction:column}
.pmenu[hidden]{display:none}
.pmenu a{padding:8px 10px!important;border:0!important;margin:0!important;border-radius:6px;color:var(--ink)!important;text-decoration:none;display:flex;gap:6px;font-weight:500}
.pmenu a:hover{background:var(--accent-soft)}.pmenu .bcheck{width:14px;color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--danger-soft);color:var(--danger);padding:1px 6px;border-radius:99px;margin-left:4px}
nav.tabs .spacer{flex:1}
nav.tabs .btn{margin-bottom:6px}

/* Tablero */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:10px;overflow-x:auto;padding-bottom:16px;align-items:start}
.col{background:var(--sunken);border-radius:var(--r);display:flex;flex-direction:column;min-height:180px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--pc);border-radius:var(--r) var(--r) 0 0}
.col-h .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h .t{font-weight:600;font-size:13.5px}
.col-h .step{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.col-h .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.st-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.st-card h3{font-size:14px;margin:0 0 4px}
.st-sub,.st-note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.hbars{display:flex;flex-direction:column;gap:2px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;padding:4px 0;border-radius:6px}
.hb:hover{background:var(--accent-soft)}
.hb-l{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hb-t{height:12px;display:block}
.hb-b{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hb-b.zero{background:var(--line)}
.hb-v{font-family:var(--f-mono);font-size:12.5px;min-width:28px;text-align:right}.hb-v small{color:var(--muted)}
.vbars{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:150px}
.vb{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:6px;padding-top:2px}
.vb:hover{background:var(--accent-soft)}
.vb-t{flex:1;width:60%;display:flex;align-items:flex-end}
.vb-b{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vb-v{font-family:var(--f-mono);font-size:11.5px;min-height:14px}
.vb-l{font-size:11px;color:var(--muted);white-space:nowrap}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:12.5px;fill:var(--muted);font-family:var(--f-mono)}
.chart .ax.strong{fill:var(--ink);font-weight:600}
.chart .hit{fill:transparent}.chart .hit:hover{fill:var(--accent-soft);fill-opacity:.5}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.lgd span{display:inline-flex;align-items:center;gap:6px}.lgd i{width:14px;height:10px;border-radius:3px;display:inline-block}
.st-card.wide{grid-column:1/-1}
.st-tiles{margin-bottom:14px}
.st-axis{font-size:11px;color:var(--muted);margin:2px 0 0;text-align:center}
.st-empty{font-size:13px;color:var(--muted);padding:26px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.hb-t.prog{background:var(--line);border-radius:4px;height:12px;overflow:hidden}.hb-t.prog .hb-b{border-radius:4px}
.sp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;font-size:14px}
.sp-head .bad{color:var(--danger);font-weight:600}
.row-end{display:flex;gap:8px;justify-content:flex-end}
.sp-form{margin-bottom:14px}.sp-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.sp-grid .full{grid-column:1/-1}
@media (max-width:640px){.sp-grid{grid-template-columns:1fr 1fr}.sp-grid .field:first-child{grid-column:1/-1}}
/* Grupos por historia */
.hgrp{display:flex;flex-direction:column;gap:4px;padding:8px 8px 7px 10px;margin:6px 0 2px;border-left:4px solid var(--ep);background:var(--surface);border-radius:6px;box-shadow:0 1px 0 var(--line)}
.hgrp:first-child{margin-top:0}
.hg-top{display:flex;align-items:flex-start;gap:6px}.hg-bot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.hg-dd{border:1px solid var(--line);background:var(--bg,transparent);border-radius:99px;padding:2px 9px;font:inherit;font-size:11.5px;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.hg-dd:hover{border-color:var(--accent);color:var(--accent)}.hgrp.open .hg-dd{background:var(--accent-soft);border-color:transparent}
.hg-pts{flex:none;margin-top:1px}
.hgrp{position:relative;z-index:2}
.hgrp.movible{cursor:grab}.hgrp.dragging{opacity:.5}
.hg-add[data-hmove]{font-size:15px;font-weight:600}
.hgrp.open{border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;box-shadow:none}
.card.in-hist{position:relative;z-index:1;margin-top:-8px;margin-left:0;border-radius:0;border-left:4px solid var(--ep);border-top:1px dashed color-mix(in oklab,var(--ep) 45%,var(--line));box-shadow:none;background:color-mix(in oklab,var(--ep) 4%,var(--surface))}
.cards .hgrp.open + .card.in-hist{margin-top:-8px}
.card.in-hist.hl{border-radius:0 0 8px 8px;box-shadow:var(--shadow);margin-bottom:4px}
.card.in-hist .name{font-size:13.5px}
.hg-dd .chev{font-size:10px;margin-left:2px}
.hgrp.loose{--ep:var(--line);background:transparent;box-shadow:none;padding-top:4px;padding-bottom:2px}
.hgrp.done .hg-t{color:var(--ok)}
.hg-fold{border:0;background:none;color:var(--muted);font-size:11px;width:18px;height:18px;padding:0;cursor:pointer;flex:none;margin-top:1px}
.hg-main{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.hg-t{font-size:12.5px;font-weight:600;line-height:1.3}
.hg-sub{font-size:11.5px;color:var(--muted);display:block;line-height:1.4}
.hg-sub i{margin-right:4px;vertical-align:1px}
.hg-sub i,.epdot{width:8px;height:8px;border-radius:50%;background:var(--ep);display:inline-block;flex:none}
.epdot{margin-right:6px}
.hg-sub .bad,.bad{color:var(--danger)}
.hg-add{border:0;background:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.hg-add:hover{background:var(--accent-soft);color:var(--accent)}
.hg-acts{display:inline-flex;gap:0;flex:none}.hg-del:hover{background:var(--danger-soft);color:var(--danger)}
.hg-add svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cards .hgrp + .card{margin-top:4px}
/* Tallas */
.tallas{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.tallas button{min-width:44px;padding:7px 10px;border:0;border-right:1px solid var(--line);background:var(--surface);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.tallas button:last-child{border-right:0}
.tallas button[aria-checked="true"]{background:var(--accent);color:#fff}
.xxl-hint{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:8px 10px;font-size:13px;margin:8px 0 0}
.xxl-hint[hidden]{display:none}
.plz.talla{font-weight:700}.plz.t-XXL{background:var(--warn-soft);color:var(--warn)}
/* Bloqueadas */
.bloq-foot{border-top:1px solid var(--line);margin-top:8px;padding-top:7px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.bloq-foot .txt{color:var(--danger)}.bloq-foot .since{color:var(--muted);font-size:11.5px}
.bf-row{display:flex;justify-content:space-between;align-items:center}
.card.bloq-old{box-shadow:inset 3px 0 0 var(--danger)}
.bloq-box{background:var(--danger-soft)}.bloq-info{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;margin-top:8px;flex-wrap:wrap}
.hist-row{display:flex;gap:8px;align-items:center}.hist-row select{flex:1}
/* Product Backlog */
.backlog{display:flex;flex-direction:column;gap:12px;max-width:980px}
.bl-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bl-ep{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ep);border-radius:var(--r);padding:0}
.bl-eh{position:relative;z-index:3;background:var(--surface);border-radius:var(--r);padding:10px 12px}
.bl-eh[draggable="true"]{cursor:grab}.bl-eh .grip{color:var(--muted);font-size:12px;letter-spacing:-2px}
.bl-ep.dragging{opacity:.45}.bl-ep.drop-before{box-shadow:0 -3px 0 var(--accent)}.bl-ep.drop-after{box-shadow:0 3px 0 var(--accent)}
.hist-table td .sub{font-size:12px;color:var(--muted);margin-top:2px}
.ep-tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.ep-tag i{width:9px;height:9px;border-radius:50%;background:var(--ep)}
.ht-prog{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.ht-prog .bl-prog span{background:var(--ep)}
.ht-av{display:inline-flex;gap:2px}
.st-h{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.st-h.st-bl{background:var(--danger-soft);color:var(--danger)}.st-h.st-4{background:var(--ok-soft);color:var(--ok)}.st-h.st-3{background:var(--accent-soft);color:var(--accent)}.st-h.st-2{background:var(--warn-soft);color:var(--warn)}
.hist-table tr[data-hrowt]{cursor:pointer}
.bl-ep.open .bl-eh{border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.bl-eacts{margin-left:auto;display:inline-flex;gap:8px;align-items:center}
.bl-ep .bl-list{padding:0 12px 8px}
.bl-h{flex-direction:column;align-items:stretch;gap:0;position:relative;z-index:2;background:var(--surface)}
.bl-hr{display:flex;align-items:center;gap:10px;position:relative;z-index:2;background:inherit}
.bl-h.open>.bl-hr{padding-bottom:6px}
.bl-tasks{list-style:none;margin:0 0 4px 22px;padding:0;border-left:3px solid var(--ep);position:relative;z-index:1}
.bl-t{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;background:color-mix(in oklab,var(--ep) 5%,var(--surface));border-top:1px dashed color-mix(in oklab,var(--ep) 40%,var(--line))}
.bl-t:last-child{border-radius:0 0 6px 0}
.bl-t .pill{font-size:11px;padding:1px 7px}.bl-noown{width:22px}
.bl-eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bl-eh>i{width:10px;height:10px;border-radius:50%;background:var(--ep)}
.bl-et{font-weight:700;font-size:14.5px}button.bl-et{color:inherit;text-decoration:none}
.bl-prog.sm{width:80px;height:6px}
.bl-hr .bl-meta{min-width:72px;text-align:right}
.bl-prog{width:120px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bl-prog span{display:block;height:100%;background:var(--ep)}
.bl-meta{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}

.bl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.bl-h{display:flex;padding:7px 6px;border-top:1px solid var(--line);border-radius:4px}
.bl-hr:hover{background:var(--accent-soft)}.bl-h.dragging{opacity:.4}.bl-h.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.bl-h[draggable="true"]{cursor:grab}
.bl-h .grip{color:var(--muted);font-size:12px;letter-spacing:-2px}
.bl-n{flex:1;min-width:0;text-align:left;color:inherit;text-decoration:none;font-size:13.5px}
.bl-h.done .bl-n{color:var(--ok)}
.bl-dist{display:flex;gap:3px}.bl-dist .pill{font-size:11px;padding:1px 7px}
.bl-empty{font-size:12.5px;color:var(--muted);padding:8px 6px;border-top:1px solid var(--line)}
.swatches{display:grid;grid-template-columns:repeat(8,28px);gap:8px}.swatches button{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.h-tasks{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.h-tasks li{display:flex;align-items:center;gap:8px;font-size:13px}.h-tasks li .link{flex:1;text-align:left}
/* Sprint */
.plan{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.plan h4{margin:0 0 6px;font-size:13.5px}

const esCompartido=id=>String(id||'').startsWith('sh:');
class DataStore{
  constructor(){this._fns=new Set()}
  /** Mis tableros. @returns {Promise<{id:string, nombre:string}[]>} */
  async listarEmbudos(){throw new Error('No implementado')}

  async crearEmbudo(nombre,datos){throw new Error('No implementado')}

  async cargar(id){throw new Error('No implementado')}
  /** Guarda los datos de un tablero. Se llama en cada cambio: agrupa o aplaza si hace falta. */
  async guardar(id,datos){throw new Error('No implementado')}
  /** Borra un tablero y sus datos. */
  async eliminar(id){throw new Error('No implementado')}
  /** Avisa cuando los datos de un tablero cambian desde fuera (fn recibe el id). Devuelve una función para dejar de escuchar. */
  suscribir(fn){this._fns.add(fn);return ()=>this._fns.delete(fn)}
  _emitir(id){this._fns.forEach(f=>{try{f(id)}catch(e){}})}
}

/* Implementación en este navegador (localStorage). */
class LocalStore extends DataStore{
  constructor(){super();this.BASE='embudo-ffe-v1';this.LISTA='embudo-ffe-embudos'}
  _key(id){return id==='principal'?this.BASE:esCompartido(id)?this.BASE+':sh-'+id.slice(3):this.BASE+':'+id}
  _lista(){let l=[];try{l=JSON.parse(localStorage.getItem(this.LISTA)||'[]')||[]}catch(e){}if(!l.some(b=>b.id==='principal'))l.unshift({id:'principal',nombre:''});return l}
  _guardarLista(l){try{localStorage.setItem(this.LISTA,JSON.stringify(l))}catch(e){}}
  async listarEmbudos(){return this._lista()}
  async crearEmbudo(nombre,datos){
    const id='b'+uid(),l=this._lista();l.push({id,nombre});this._guardarLista(l);
    const d=normalizar(datos?clone(datos):{empresas:[]});d.nombre=nombre;await this.guardar(id,d);return id;
  }
  async cargar(id){
    let d=null;try{d=JSON.parse(localStorage.getItem(this._key(id))||'null')}catch(e){}
    if(!d&&id==='principal')d={empresas:sample()};
    return d;
  }
  async guardar(id,datos){
    try{localStorage.setItem(this._key(id),JSON.stringify(datos))}catch(e){throw new Error('No hay espacio para guardar')}
    if(!esCompartido(id)){const l=this._lista(),b=l.find(x=>x.id===id),n=(datos&&datos.nombre)||'';if(b&&b.nombre!==n){b.nombre=n;this._guardarLista(l)}}
  }
  async eliminar(id){
    try{localStorage.removeItem(this._key(id))}catch(e){}
    if(!esCompartido(id))this._guardarLista(this._lista().filter(b=>b.id!==id));
  }
}

function normalizar(d){
  if(!d||!Array.isArray(d.empresas))d={...(d||{}),empresas:[]};
  if(!d.plantilla)d.plantilla='ffe';
  if(d.plantilla==='scrum'&&Array.isArray(d.fases)){const M={'Pila de producto':'Product Backlog','Pila del sprint':'Sprint Backlog','En curso':'In Progress','En revisión':'Review','Hecho':'Done'};d.fases.forEach(f=>{if(/^sc\d$/.test(f.id)&&M[f.label])f.label=M[f.label]});if(!d.fases.some(f=>'libre' in f))d.fases.forEach(f=>{if(f.id==='sc1'||f.id==='sc2')f.libre=true})}
  const ffe=d.plantilla==='ffe';
  if(!d.voc)d.voc=ffe?{uno:'empresa',varios:'empresas',g:'f'}:{uno:'elemento',varios:'elementos',g:'m'};
  if(d.proposito===undefined)d.proposito=ffe?'Formación en empresa · Curso 2026-27':'';
  if(d.accion0===undefined)d.accion0=ffe?'Primera llamada':'';
  if(!Array.isArray(d.fases))d.fases=clone(DEF_FASES);
  if(!Array.isArray(d.campos))d.campos=clone(DEF_CAMPOS);
  if(ffe&&!d.campos.some(c=>c.key==='web')){const i=d.campos.findIndex(c=>c.key==='email');d.campos.splice(i<0?d.campos.length:i+1,0,{key:'web',label:'Web de contacto',tipo:'url',grupo:'contacto',lista:false,builtin:true,visible:true})}
  if(d.paneles===undefined)d.paneles=d.plantilla!=='ffe'&&!!(plantillaDef(d.plantilla)||{}).paneles;
  if(d.plantilla==='scrum'&&!d.jerarquia){
    d.jerarquia=true;d.historias=d.historias||[];
    const ce=d.campos.find(c=>c.key==='x_epica');d.epicas=d.epicas||(ce?(ce.opciones||[]).map((n,i)=>({id:'ep_'+uid(),nombre:n,color:EPI_COLORS[i%EPI_COLORS.length]})):[]);
    if(!d.campos.some(c=>c.tipo==='talla')){const i=d.campos.findIndex(c=>c.key==='x_pts');d.campos.splice(i<0?0:i,0,{key:'talla',label:'Tamaño',tipo:'talla',builtin:true,visible:true,lista:true,grupo:'empresa',sumaL:'Puntos',unidad:'pt'})}
    d.empresas.forEach(e=>{if(e.x_pts!=null&&e.x_pts!==''&&!e.talla)e.talla=tallaCercana(e.x_pts);delete e.x_pts;delete e.x_epica});
    d.campos=d.campos.filter(c=>c.key!=='x_pts'&&c.key!=='x_epica');
    if(!d.fases.some(f=>f.bloqueo)){const i=d.fases.findIndex(f=>f.id==='sc3');d.fases.splice(i<0?d.fases.length-1:i+1,0,{id:'sc_bl',label:'Blocked',hint:'Detenidas por un impedimento',closed:false,bloqueo:true})}
  }
  if(d.jerarquia){
    d.epicas=d.epicas||[];d.historias=d.historias||[];limpiarEjemplos(d);
    const general=()=>{let g=d.epicas.find(x=>x.nombre==='General');if(!g){g={id:'ep_'+uid(),nombre:'General',color:'#5B6B7A'};d.epicas.push(g)}return g.id};
    d.historias.forEach(h=>{if(!d.epicas.some(x=>x.id===h.epica))h.epica=general()});
    const sueltas=d.empresas.filter(e=>!d.historias.some(h=>h.id===e.historia));
    if(sueltas.length){let h=d.historias.find(x=>x.nombre==='Tareas sin clasificar');if(!h){h={id:'h_'+uid(),nombre:'Tareas sin clasificar',epica:general(),desc:'Creada automáticamente para las tareas que no tenían historia. Reparte sus tareas en otras historias.'};d.historias.push(h)}sueltas.forEach(e=>e.historia=h.id)}
  }
  migrarMov(d);
  if(d.ejemplo){const names=sample().map(e=>e.nombre);d.empresas.forEach(e=>{if(names.includes(e.nombre))e.ejemplo=true});delete d.ejemplo}
  return d;
}
/* ---------- Movimientos entre columnas (para las métricas) ----------
   Cada tarjeta guarda creado (fecha) y mov: [{f:fecha, de:idColumna, a:idColumna}].
   Se registran solos al guardar, comparando con el estado anterior de cada tarjeta. */
const lastEst=new Map();
function resetEst(){lastEst.clear();S.empresas.forEach(e=>lastEst.set(e.id,e.estado))}
function trackMov(){
  S.empresas.forEach(e=>{
    if(!e.creado)e.creado=TODAY;
    const p=lastEst.get(e.id);
    if(p!==undefined&&p!==e.estado){
      (e.mov=e.mov||[]).push({f:TODAY,de:p,a:e.estado});
      const bA=esBloq(p),bB=esBloq(e.estado);
      if(bB&&!bA){e.bloq={desde:p,f:TODAY};e.motivo=''}
      else if(bA&&!bB){const d=e.bloq&&e.bloq.f?Math.max(0,Math.round((toD(TODAY)-toD(e.bloq.f))/864e5)):0;(e.historial=e.historial||[]).unshift({fecha:TODAY,texto:`Desbloqueada tras ${d} día${d===1?'':'s'}${e.motivo?`. Impedimento: ${e.motivo}`:''}`,sys:true});e.motivo='';delete e.bloq}
    }
    lastEst.set(e.id,e.estado);
  });
}
// Quita épicas, historias y sprints de ejemplo que ya no tienen tareas de ejemplo
function limpiarEjemplos(d){
  if(!d.jerarquia||d.empresas.some(e=>e.ejemplo))return;
  const ejH=h=>h.ejemplo||/^h\d+$/.test(h.id),ejE=x=>x.ejemplo||/^ep\d+$/.test(x.id),ejS=x=>x.ejemplo||/^sp_\d+$/.test(x.id);
  d.historias=(d.historias||[]).filter(h=>!ejH(h)||d.empresas.some(e=>e.historia===h.id));
  d.epicas=(d.epicas||[]).filter(x=>!ejE(x)||d.historias.some(h=>h.epica===x.id));
  d.sprints=(d.sprints||[]).filter(x=>!ejS(x));
  if(d.plantilla==='scrum'&&/^Sprint 3 · Inicio de sesión/.test(d.proposito||''))d.proposito='Sprint 1';
}
function migrarMov(d){
  const byLabel=new Map(d.fases.map(f=>[f.label,f.id]));
  d.empresas.forEach(e=>{
    const h=(e.historial||[]).filter(x=>x.fecha);
    if(!e.creado)e.creado=h.length?h.map(x=>x.fecha).sort()[0]:TODAY;
    if(!Array.isArray(e.mov)){
      e.mov=[];
      h.filter(x=>x.sys&&/ → /.test(x.texto||'')).slice().reverse().forEach(x=>{const [a,b]=x.texto.split(' → ');const de=byLabel.get(a),to=byLabel.get(b);if(de&&to)e.mov.push({f:x.fecha,de,a:to})});
    }
  });
}

/* ---------- Deshacer / rehacer ---------- */
let past=[],future=[],lastSnap=JSON.stringify(S),lastQuiet=0;
function save(o={}){
  trackMov();
  const cur=JSON.stringify(S);
  persistir();
  if(o.hist===false||cur===lastSnap)return false;
  const now=Date.now();
  if(!(o.quiet&&lastQuiet&&now-lastQuiet<1500)){past.push(lastSnap);if(past.length>100)past.shift()}
  lastQuiet=o.quiet?now:0;future=[];lastSnap=cur;updUndo();return true;
}
function updUndo(){const u=$('#undo'),r=$('#redo');if(u)u.disabled=!past.length;if(r)r.disabled=!future.length}
function applySnap(s){
  S=JSON.parse(s);resetEst();lastSnap=s;lastQuiet=0;persistir();
  pendingDel=null;editingTh=null;
  const c=S.campos.find(x=>x.key==='ciclos');if(fciclo&&!(c&&c.visible&&(c.opciones||[]).includes(fciclo)))fciclo='';
  fillCicloFilter();renderAll();
  if(modalKind==='config')renderConfig();
  if(modalKind==='export')renderExport();
  if(openId){if(byId(openId))openDrawer(openId);else{openId=null;$('#drawer').hidden=true;$('#overlay').hidden=true}}
  updUndo();
}
function undo(){if(!past.length||!puedeEditar())return;future.push(lastSnap);applySnap(past.pop());toast('Deshecho',2500,{label:'Rehacer',fn:redo})}
function redo(){if(!future.length||!puedeEditar())return;past.push(lastSnap);applySnap(future.pop());toast('Rehecho',2000)}
const UNDO={label:'Deshacer',fn:()=>undo()};

/* ---------- Fases ---------- */
const fase=id=>S.fases.find(f=>f.id===id);
const activas=()=>S.fases.filter(f=>!f.closed);
const isClosed=id=>!!(fase(id)||{}).closed;
const label=id=>(fase(id)||{}).label||'Sin fase';
function pcolor(id){
  const f=fase(id);if(!f)return 'var(--closed)';
  if(f.bloqueo)return 'var(--danger)';
  if(f.closed)return 'var(--closed)';
  const a=activas(),i=a.indexOf(f),n=a.length;
  const pct=n<=1?100:Math.round(12+88*i/(n-1));
  return `color-mix(in oklab, var(--ramp-end) ${pct}%, var(--ramp-start))`;
}
const primeraActiva=()=>(activas()[0]||S.fases[0]).id;
// Columnas «libres»: sus tarjetas no tienen dueño. Por defecto, solo la primera columna en curso.
const hayLibres=()=>S.fases.some(f=>'libre' in f);
const esLibre=id=>{const f=fase(id);if(!f||f.closed)return false;return hayLibres()?f.libre===true:id===primeraActiva()};
const campo=k=>S.campos.find(c=>c.key===k);
const visible=k=>{const c=campo(k);return !!(c&&c.visible)};

function dueInfo(e){
  if(isClosed(e.estado))return null;
  if(!e.accionFecha)return {cls:'none',txt:'Sin fecha'};
  const n=days(e.accionFecha);
  if(n<0)return {cls:'vencida',txt:n===-1?'Ayer':`Hace ${-n} d`};
  if(n===0)return {cls:'hoy',txt:'Hoy'};
  if(n===1)return {cls:'semana',txt:'Mañana'};
  if(n<=7)return {cls:'semana',txt:fmt(e.accionFecha)};
  return {cls:'',txt:fmt(e.accionFecha)};
}

const CREADAS=new Set();
let view='embudo', q='', fciclo='', sortKey='accionFecha', openId=null, sortDir=1, editingTh=null;

function filtered(){
  const t=q.trim().toLowerCase();
  return S.empresas.filter(e=>{
    if(soloMias&&view==='embudo'&&e.dueno!==miId()&&!CREADAS.has(e.id))return false;
    if(fciclo&&!(e.ciclos||[]).includes(fciclo))return false;
    if(!t)return true;
    const hh=historia(e.historia),ee=hh&&epica(hh.epica);
    const txt=[e.nombre,e.accion,e.motivo,hh&&hh.nombre,ee&&ee.nombre,...S.campos.map(c=>Array.isArray(e[c.key])?e[c.key].join(' '):e[c.key])].join(' ').toLowerCase();
    return txt.includes(t);
  });
}

/* ---------- Resumen ---------- */
function renderStats(){
  const act=S.empresas.filter(e=>!isClosed(e.estado));
  const venc=act.filter(e=>e.accionFecha&&days(e.accionFecha)<0).length;
  const hoy=act.filter(e=>e.accionFecha&&days(e.accionFecha)===0).length;
  const sin=act.filter(e=>!e.accionFecha).length;
  const iF=S.fases.findIndex(f=>f.id==='firmado');
  let extra='';
  if(iF<0){const dn=S.fases.filter(f=>f.closed&&f.motivo===false);if(dn.length){const ids=dn.map(f=>f.id),n=S.empresas.filter(e=>ids.includes(e.estado)).length;extra=`<div class="stat good"><span class="n">${n}</span><span class="l">En «${esc(dn[0].label)}»</span></div>`}}
  if(iF>=0){
    const ids=S.fases.filter((f,i)=>i>=iF&&!f.closed).map(f=>f.id);
    const firm=S.empresas.filter(e=>ids.includes(e.estado));
    extra=`<div class="stat good"><span class="n">${firm.length}</span><span class="l">Convenios firmados</span></div>`;
    if(visible('plazas'))extra+=`<div class="stat good"><span class="n">${firm.reduce((a,e)=>a+(+e.plazas||0),0)}</span><span class="l">Plazas aseguradas</span></div>`;
  }
  if(!usaAgenda()){
    const dn=S.fases.filter(f=>f.closed&&f.motivo===false),ids=dn.map(f=>f.id),done=S.empresas.filter(e=>ids.includes(e.estado));
    let h=`<div class="stat"><span class="n">${act.length}</span><span class="l">${capi(vv())} pendientes</span></div>`;
    sumaCampos().forEach(c=>{h+=`<div class="stat"><span class="n">${sumaDe(c,act)}</span><span class="l">${esc(c.sumaL||c.label)} pendientes</span></div><div class="stat good"><span class="n">${sumaDe(c,done)}</span><span class="l">${esc(c.sumaL||c.label)} en «${esc(dn[0]?dn[0].label:'cierre')}»</span></div>`});
    const nb=S.empresas.filter(e=>esBloq(e.estado)).length;if(S.fases.some(f=>f.bloqueo))h+=`<div class="stat${nb?' alert':''}"><span class="n">${nb}</span><span class="l">Bloquead${gx('as','os')}</span></div>`;
    const over=S.fases.filter(excedeWip);
    h+=`<div class="stat${over.length?' alert':''}"><span class="n">${over.length}</span><span class="l">${over.length===1?'Columna':'Columnas'} por encima del límite</span></div>`;
    $('#stats').innerHTML=h;$('#agcount').hidden=true;return;
  }
  $('#stats').innerHTML=`
    <div class="stat"><span class="n">${act.length}</span><span class="l">${capi(vv())} en el tablero</span></div>
    <button class="stat alert" data-go="agenda"><span class="n">${venc}</span><span class="l">Acciones vencidas</span></button>
    <button class="stat today" data-go="agenda"><span class="n">${hoy}</span><span class="l">Para hoy</span></button>
    <button class="stat${sin?' alert':''}" data-go="agenda"><span class="n">${sin}</span><span class="l">Sin próxima acción</span></button>
    ${extra}`;
  const n=venc+hoy+sin;$('#agcount').textContent=n;$('#agcount').hidden=!n;
}

  const subC=S.campos.find(c=>c.tipo==='text'&&c.grupo==='empresa'&&c.visible!==false&&String(e[c.key]||'').trim());

  const th=(k,t,ed0)=>{const ed=ed0&&esProp();return `<th ${sortKey===k?`aria-sort="${sortDir>0?'ascending':'descending'}"`:''}>${editingTh===k?`<input class="th-name" data-thedit="${k}" value="${esc(t)}" aria-label="Nombre del campo">`:`<button data-sort="${k}" ${ed?'data-ed="1"':''} data-tip="${ed?'Clic: ordenar · Doble clic: cambiar el nombre':'Clic: ordenar'}">${esc(t)}<span class="arr">${sortKey===k?(sortDir>0?' ↑':' ↓'):''}</span></button>${campo(k)&&esProp()?`<button class="th-del" data-thdel="${k}" aria-label="Borrar el campo ${esc(t)}" data-tip="Borrar este campo y sus datos">${TRASH}</button>`:''}`}</th>`};

/* =====================================================================
   MÉTRICAS: sprints, quemado, velocidad, flujo, tiempos de ciclo, previsión
   ===================================================================== */
const DAY=864e5;
const toD=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=toD(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((toD(b)-toD(a))/DAY);
const rango=(a,b)=>{const r=[];for(let d=a;d<=b;d=addD(d,1))r.push(d);return r};
const unidadM=()=>{const c=sumaCampos()[0];return c?{c,u:c.unidad||c.label.toLowerCase(),val:e=>valCampo(c,e)}:{c:null,u:vv(),val:()=>1}};
const doneIds=()=>{const d=S.fases.filter(f=>f.closed&&f.motivo===false);return (d.length?d:S.fases.filter(f=>f.closed)).map(f=>f.id)};
const movs=e=>(e.mov||[]).slice().sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0);
function estadoEn(e,d){
  if((e.creado||TODAY)>d)return null;
  const m=movs(e);let st=m.length?m[0].de:e.estado;
  for(const x of m){if(x.f<=d)st=x.a;else break}
  return st;
}
function hechoEl(e){const D=doneIds();if(!D.includes(e.estado))return null;const m=movs(e).filter(x=>D.includes(x.a));return m.length?m[m.length-1].f:(e.creado||null)}
function empezadoEl(e){
  const D=doneIds(),m=movs(e).find(x=>D.includes(x.a)||(!esLibre(x.a)&&!(fase(x.a)||{}).closed));
  return m?m.f:null;
}
function enColumnaDesde(e){const m=movs(e).filter(x=>x.a===e.estado);return m.length?m[m.length-1].f:(e.creado||TODAY)}
const pctl=(arr,p)=>{if(!arr.length)return null;const a=arr.slice().sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.ceil(p/100*a.length)-1)]};
const fmtD=s=>{if(!s)return '—';const d=toD(s);return `${d.getDate()} ${MES[d.getMonth()]}`};

// Sprints: S.sprints=[{id,nombre,objetivo,inicio,fin,comp:{n,pts},hecho:{n,pts},cerrado,cerradoEl}]
const sprints=()=>S.sprints||(S.sprints=[]);
const sprintActivo=()=>sprints().find(s=>!s.cerrado)||null;
const enSprintEn=(e,d,inicio)=>{const st=estadoEn(e,d);if(!st||st===S.fases[0].id)return false;const f=fase(st);if(!f)return false;if(f.closed){if(!doneIds().includes(st))return false;const h=hechoEl(e);return !!h&&h>=inicio}return true};
function alcance(sp,d){
  const U=unidadM();let tot=0,hech=0;const D=doneIds();
  S.empresas.forEach(e=>{if(!enSprintEn(e,d,sp.inicio))return;const v=U.val(e);tot+=v;if(D.includes(estadoEn(e,d)))hech+=v});
  return {tot,hech,rest:tot-hech};
}
function compDe(sp){if(sp.comp)return sp.comp;const U=unidadM();let n=0,pts=0;S.empresas.forEach(e=>{const st=estadoEn(e,sp.inicio);if(st&&st!==S.fases[0].id&&!(fase(st)||{}).closed){n++;pts+=U.val(e)}});return {n,pts}}
function hechoDe(sp){
  if(sp.hecho)return sp.hecho;const U=unidadM();const fin=sp.cerradoEl||TODAY;let n=0,pts=0;
  S.empresas.forEach(e=>{const h=hechoEl(e);if(h&&h>=sp.inicio&&h<=fin){n++;pts+=U.val(e)}});return {n,pts};
}

/* ---------- Gráficos SVG ---------- */
let CW=460,CH=220;const PADL=38,PADR=10,PADT=14,PADB=28;
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function ejes(ymax,xl,opts={}){
  const iw=CW-PADL-PADR,ih=CH-PADT-PADB,ticks=ymax<=5?ymax:ymax%4===0?4:5;let g='';
  for(let i=0;i<=ticks;i++){const y=PADT+ih-ih*i/ticks,v=Math.round(ymax*i/ticks*10)/10;g+=`<line x1="${PADL}" x2="${CW-PADR}" y1="${y}" y2="${y}" class="grid"/><text x="${PADL-6}" y="${y+3.5}" text-anchor="end" class="ax">${v}</text>`}
  const n=xl.length,step=Math.max(1,Math.ceil(n/(opts.maxL||Math.round(CW/80))));
  xl.forEach((l,i)=>{if(i%step&&!(i===n-1&&(n-1)%step>=step*.6))return;const x=opts.band?PADL+iw*(i+.5)/n:PADL+(n<=1?iw/2:iw*i/(n-1));g+=`<text x="${x}" y="${CH-8}" text-anchor="middle" class="ax">${esc(l)}</text>`});
  return g;
}
const sx=(i,n)=>PADL+(n<=1?(CW-PADL-PADR)/2:(CW-PADL-PADR)*i/(n-1));
const sy=(v,ymax)=>PADT+(CH-PADT-PADB)*(1-v/ymax);
const svgWrap=(inner,label)=>`<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
function leyenda(items){return `<div class="lgd">${items.map(i=>`<span><i style="background:${i.c}${i.dash?';background:none;border-top:2px dashed '+i.c+';height:0':''}"></i>${esc(i.n)}</span>`).join('')}</div>`}
function lineas(xl,series,tips,label){
  const ymax=niceMax(Math.max(1,...series.flatMap(s=>s.v.filter(v=>v!=null))));const n=xl.length;
  let g=ejes(ymax,xl);
  series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:`${sx(i,n)},${sy(v,ymax)}`).filter(Boolean);if(!pts.length)return;
    g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(!s.dash){const li=s.v.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();g+=`<circle cx="${sx(li,n)}" cy="${sy(s.v[li],ymax)}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`}});
  const w=(CW-PADL-PADR)/Math.max(1,n-1);
  xl.forEach((l,i)=>{g+=`<rect class="hit" x="${sx(i,n)-w/2}" y="${PADT}" width="${w}" height="${CH-PADT-PADB}" data-tip="${esc(tips(i))}"/>`});
  return svgWrap(g,label);
}
function barrasV(xl,series,tips,label,opts={}){
  const ymax=niceMax(Math.max(1,...series.flatMap(s=>s.v),opts.ref||0));const n=xl.length,iw=CW-PADL-PADR,bw=iw/n;
  let g=ejes(ymax,xl,{band:true,maxL:opts.maxL||Math.round(CW/48)});const k=series.length,gap=2,inner=Math.min(bw*.7,40*k),w=(inner-gap*(k-1))/k;
  xl.forEach((l,i)=>{const x0=PADL+bw*i+(bw-inner)/2;series.forEach((s,j)=>{const v=s.v[i]||0,y=sy(v,ymax),h=Math.max(v?2:0,PADT+(CH-PADT-PADB)-y);
    const c=typeof s.c==='function'?s.c(i):s.c;g+=`<path d="M${x0+j*(w+gap)},${y+h} v${-(h-Math.min(4,h))} q0,-${Math.min(4,h)} ${Math.min(4,w/2)},-${Math.min(4,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,h)} v${h-Math.min(4,h)} z" fill="${c}"/>`});
    g+=`<rect class="hit" x="${PADL+bw*i}" y="${PADT}" width="${bw}" height="${CH-PADT-PADB}" data-tip="${esc(tips(i))}"/>`});
  if(opts.ref!=null){const y=sy(opts.ref,ymax);g+=`<line x1="${PADL}" x2="${CW-PADR}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${CW-PADR}" y="${y-5}" text-anchor="end" class="ax strong">${esc(opts.refL||'')}</text>`}
  return svgWrap(g,label);
}
function areas(xl,capas,tips,label){
  const n=xl.length,tot=xl.map((_,i)=>capas.reduce((a,c)=>a+c.v[i],0)),ymax=niceMax(Math.max(1,...tot));let g=ejes(ymax,xl);
  const base=xl.map(()=>0);
  capas.forEach(c=>{const top=c.v.map((v,i)=>base[i]+v);
    const up=top.map((v,i)=>`${sx(i,n)},${sy(v,ymax)}`),dn=base.map((v,i)=>`${sx(i,n)},${sy(v,ymax)}`).reverse();
    g+=`<polygon points="${up.concat(dn).join(' ')}" fill="${c.c}" stroke="var(--surface)" stroke-width="1"/>`;top.forEach((v,i)=>base[i]=v)});
  const w=(CW-PADL-PADR)/Math.max(1,n-1);xl.forEach((l,i)=>{g+=`<rect class="hit" x="${sx(i,n)-w/2}" y="${PADT}" width="${w}" height="${CH-PADT-PADB}" data-tip="${esc(tips(i))}"/>`});
  return svgWrap(g,label);
}
function puntos(xl,pts,refs,label,opts={}){
  // pts: [{x:índice, y, tip, alerta}]
  const ymax=niceMax(Math.max(1,...pts.map(p=>p.y),...refs.map(r=>r.v)));const n=xl.length;let g=ejes(ymax,xl,{band:!!opts.band});
  const X=i=>opts.band?PADL+(CW-PADL-PADR)*(i+.5)/n:sx(i,n);
  refs.forEach(r=>{const y=sy(r.v,ymax);g+=`<line x1="${PADL}" x2="${CW-PADR}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="${r.dash||'5 4'}" opacity=".7"/><text x="${CW-PADR}" y="${y-5}" text-anchor="end" class="ax strong">${esc(r.l)}</text>`});
  pts.forEach(p=>{g+=`<circle cx="${X(p.x)+(p.j||0)}" cy="${sy(p.y,ymax)}" r="5" fill="${p.alerta?'var(--danger)':'var(--accent)'}" fill-opacity=".85" stroke="var(--surface)" stroke-width="2" data-tip="${esc(p.tip)}"/>`});
  return svgWrap(g,label);
}
const tarjeta=(t,sub,body,cls='')=>`<section class="st-card ${cls}"><h3>${esc(t)}</h3>${sub?`<p class="st-sub">${sub}</p>`:''}${body}</section>`;
const tile=(n,l,cls='')=>`<div class="stat ${cls}"><span class="n">${n}</span><span class="l">${l}</span></div>`;
const vacio=t=>`<div class="st-empty">${t}</div>`;

  const cic90=ciclo.filter(x=>diffD(x.fin,TODAY)<=90),ds=cic90.map(x=>x.dias),med=pctl(ds,50),p85=pctl(ds,85);

// Desliza elementos desde debajo de una cabecera (o los recoge bajo ella), como cartas
function slideItems(hdr,items,salir){
  if(!hdr||!items.length||RM.matches)return [];
  const hb=hdr.getBoundingClientRect().bottom,n=items.length;
  return items.map((c,i)=>{
    const r=c.getBoundingClientRect(),t0=-(r.top-hb)-r.height,clip=t=>`inset(${hb-r.top-t}px -20px -20px -20px)`;
    const fr=[{transform:`translateY(${t0}px)`,clipPath:clip(t0)},{transform:'translateY(0px)',clipPath:clip(0)}];
    return c.animate(salir?fr.reverse():fr,{duration:salir?230:300,delay:Math.min(i,8)*(salir?30:40)+(salir?0:0),easing:salir?'cubic-bezier(.5,0,.75,0)':'cubic-bezier(.2,.8,.2,1)',fill:salir?'forwards':'backwards'});
  });
}

function blToggle(keys,abrir){
  keys=keys.filter(k=>abrir!==BLO.has(k));if(!keys.length)return;
  if(abrir){keys.forEach(k=>BLO.add(k));guardaBLO();blAnim=keys;renderAll();return}
  const fin=()=>{keys.forEach(k=>BLO.delete(k));guardaBLO();renderAll()};
  const an=keys.flatMap(k=>slideItems(blHdr(k),blItems(k),true));
  if(!an.length){fin();return}
  let n=an.length;an.forEach(a=>a.onfinish=()=>{if(--n===0)fin()});
}

function cambiarColumna(e,to,o={}){
  if(!e||e.estado===to)return false;const from=e.estado;
  e.estado=to;if(!o.keepPos)delete e.pos;
  if(o.quitarDueno)delete e.dueno;else tomarDueno(e);

  if(isClosed(to)){e.accion='';e.accionFecha=''}

}

function loadXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length;
  const del=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch;continue}
    if(ch==='"')inQ=true;
    else if(ch===del){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
async function readFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  try{
    if(ext==='csv'||ext==='txt'){
      const buf=await file.arrayBuffer();let text;
      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('windows-1252').decode(buf)}
      setRows(parseCSV(text.replace(/^﻿/,'')),file.name,null);
    }else if(['xlsx','xls','ods','xlsm'].includes(ext)){
      try{await loadXLSX()}catch(e){renderImport('No se ha podido cargar el lector de Excel. Comprueba la conexión, o guarda el archivo como CSV desde Excel y súbelo así.');return}
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      imp={wb,sheet:wb.SheetNames[0],file:file.name};loadSheet();
    }else renderImport(`«${esc(file.name)}» no es un Excel ni un CSV. Usa un archivo .xlsx, .xls, .ods o .csv.`);
  }catch(err){renderImport('No se ha podido leer el archivo. Si es un Excel con contraseña, quítasela o guárdalo como CSV.')}
}
function loadSheet(){

function setRows(rows,file,wb,sheet){

  const data=rows.slice(1).map(r=>headers.map((_,j)=>r[j]??''));
  const map=[];headers.forEach(h=>{const t=autoMatch(h);map.push(t&&t!=='__new'&&map.includes(t)?'':t)});
  imp={wb,sheet,file,headers,rows:data,map,fase:imp&&imp.fase||primeraActiva(),dup:'update',clear:S.empresas.some(e=>e.ejemplo)};

}
function toISO(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+432e5));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  return '';
}
function matchFase(v){
  const n=norm(v);if(!n)return null;
  const f=S.fases.find(f=>norm(f.label)===n||f.id===n)||S.fases.find(f=>n.length>=4&&(norm(f.label).includes(n)||n.includes(norm(f.label))));
  return f?f.id:null;
}
function doImport(){
  // campos nuevos
  const keys=imp.map.map((t,j)=>{
    if(t!=='__new')return t;
    const sample=imp.rows.map(r=>r[j]).filter(v=>v!==''&&v!=null).slice(0,5);
    const isDate=sample.length&&sample.every(v=>v instanceof Date||toISO(v)&&typeof v!=='number');
    const c={key:'x_'+uid(),label:imp.headers[j],tipo:isDate?'date':'text',grupo:'otros',builtin:false,visible:true,lista:false};
    S.campos.push(c);return c.key;
  });
  keys.forEach(k=>{const c=campo(k);if(c&&c.builtin&&!c.visible)c.visible=true});
  if(imp.clear){S.empresas=S.empresas.filter(e=>!e.ejemplo);limpiarEjemplos(S)}
  let added=0,updated=0,skipped=0,noname=0,faseUnk=0;
  const fuente=imp.file;
  imp.rows.forEach(r=>{
    const o={};
    keys.forEach((k,j)=>{
      if(!k)return;let v=r[j];
      if(v===''||v==null)return;
      const c=campo(k);
      if(k==='estado'){const f=matchFase(v);if(f)o.estado=f;else faseUnk++;return}
      if(k==='accionFecha'||(c&&c.tipo==='date')){const d=toISO(v);if(d)o[k]=d;return}
      if(c&&c.tipo==='number'){const n=parseInt(String(v).replace(/[^\d]/g,''),10);if(!isNaN(n))o[k]=n;return}
      if(c&&c.tipo==='ciclos'){
        const list=String(v).split(/[,;\/|+]|\s+y\s+|\s{2,}/).map(s=>s.trim().toUpperCase()).filter(Boolean);
        list.forEach(x=>{if(!(c.opciones||[]).includes(x))(c.opciones=c.opciones||[]).push(x)});
        o[k]=list;return;
      }
      o[k]=v instanceof Date?iso(v):String(v).trim();
    });
    if(!o.nombre){noname++;return}
    const ex=S.empresas.find(e=>norm(e.nombre)===norm(o.nombre));

    if(isClosed(e.estado)){e.accion='';e.accionFecha=''}

  });

  const parts=[`${added} ${vN(added)} importad${gx('a','o')}${added===1?'':'s'}`];
  if(updated)parts.push(`${updated} actualizada${updated===1?'':'s'}`);
  if(skipped)parts.push(`${skipped} ya existían`);
  if(noname)parts.push(`${noname} sin nombre`);
  if(faseUnk)parts.push(`${faseUnk} con fase desconocida (van a «${label(imp?.fase||primeraActiva())}»)`);
  toast(parts.join(' · '),5000);
}

async function callAPI(body,key,signal){

  return j;

async function askAI(q,web,max,signal){
  const cfg=aiCfg();
  const ciclos=(campo('ciclos')?.opciones||[]).join(', ')||'SMR, ASIR, DAW, DAM';
  const ya=S.empresas.map(e=>e.nombre).filter(Boolean).slice(0,300).join('; ');
  const ffe=esFFE(),cosas=ffe?'empresas':vv();
  const intro=ffe?`Ayudas a un tutor de un centro de Formación Profesional en España a localizar empresas para la Formación en Empresa (FFE) de su alumnado. Ciclos del centro: ${ciclos}.`
    :`Ayudas a organizar un tablero de ${vv()} llamado «${S.nombre||''}»${S.proposito?` (${S.proposito})`:''}. Cada elemento es ${gx('una','un')} ${vu()}.`;
  const reglas=[
    `Devuelve como máximo ${max} ${cosas} (nunca más de ${AI_MAX}).`,
    `Solo datos reales. Si no encuentras un dato${ffe?' (persona de contacto, teléfono, email)':''}, déjalo vacío. Nunca inventes ni deduzcas teléfonos, emails ni nombres de personas.`,
    web?`Usa la búsqueda web. Indica en «fuente» la URL de donde sacas los datos${ffe?' de cada empresa':''}.`:'No tienes acceso a internet: extrae únicamente lo que aparece en el texto del usuario.',
    `${ffe?'':`En «nombre» pon el título de cada ${vu()}. `}Rellena los campos tal como los describe la herramienta guardar_empresas. Deja vacío cualquier campo que no puedas sacar de una fuente o del texto.`,
    ...(ffe?['En los campos de ciclos elige solo de la lista del centro los que encajen con la actividad de la empresa.']:[]),
    `No incluyas ${cosas} que ya están en el tablero${ya?`: ${ya}`:''}.`,
    'Al terminar, llama una sola vez a la herramienta guardar_empresas con todos los resultados (o con una lista vacía). No escribas el listado como texto.'
  ];
  const system=`${intro}\nReglas:\n${reglas.map(r=>'- '+r).join('\n')}`;
  const tools=[toolEmp()];
  if(web)tools.unshift({type:'web_search_20250305',name:'web_search',max_uses:8,user_location:{type:'approximate',country:'ES',timezone:'Europe/Madrid'}});
  let messages=[{role:'user',content:q}],nudged=false;
  for(let i=0;i<8;i++){
    const r=await callAPI({model:cfg.model,max_tokens:16000,system,tools,messages},cfg.key,signal);
    const content=r.content||[];
    const tu=content.find(b=>b.type==='tool_use'&&b.name==='guardar_empresas');
    if(tu)return (tu.input&&Array.isArray(tu.input.empresas))?tu.input.empresas:[];
    if(r.stop_reason==='pause_turn'){
      const last=messages[messages.length-1];

      continue;
    }
    const txt=content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const mm=txt.match(/\[[\s\S]*\]/);

    if(nudged)return [];
    nudged=true;
    messages=[...messages,{role:'assistant',content},{role:'user',content:'Llama ahora a guardar_empresas con los resultados (o con una lista vacía si no hay ninguna).'}];
  }
  return [];
}
function aiErr(err){
  const msg=String(err&&err.message||'');
  if(err.status===429)return 'Has hecho demasiadas peticiones seguidas. Espera un minuto y vuelve a intentarlo.';
  if(err.status===529||err.status>=500)return 'El servicio de Claude está saturado ahora mismo. Inténtalo en unos minutos.';
  if(err.status===400&&/credit|balance/i.test(msg))return 'Tu cuenta de la API no tiene saldo. Añade crédito en la consola de Claude.';
  if(err.status===400&&/web.?search/i.test(msg))return 'La búsqueda web está desactivada en tu cuenta de la API. Actívala en la consola de Claude o desmarca «Buscar en internet».';
  if(err.status===403)return 'Tu clave no tiene permiso para usar este modelo. Prueba con otro en «Cambiar clave o modelo».';
  if(err.status===404)return 'El modelo elegido no está disponible. Elige otro en «Cambiar clave o modelo».';
  if(err.status)return 'La API ha respondido con un error: '+msg;
  return 'No se ha podido conectar con la API de Claude. Comprueba la conexión a internet.';
}
async function runAI(){
  const qv=($('#ai-q')?.value||'').trim();ai.q=qv;
  if(!qv){$('#ai-q')?.focus();return}
  ai.web=$('#ai-web').checked;ai.max=Math.max(1,Math.min(AI_MAX,parseInt($('#ai-max').value,10)||10));
  ai.status='loading';ai.err='';ai.res=[];ai.sel=new Set();renderAI();
  const ctrl=new AbortController();ai.ctrl=ctrl;
  try{
    let res=await askAI(qv,ai.web,ai.max,ctrl.signal);
    if(ai.ctrl!==ctrl)return;
    res=(Array.isArray(res)?res:[]).filter(r=>r&&String(r.nombre||'').trim()).slice(0,Math.min(ai.max,AI_MAX));
    ai.res=res;ai.sel=new Set(res.map((_,i)=>i).filter(i=>!S.empresas.some(e=>norm(e.nombre)===norm(res[i].nombre))));
    ai.status='done';
  }catch(err){
    if(ai.ctrl!==ctrl||err.name==='AbortError')return;
    if(err.status===401){ai.status='idle';ai.ctrl=null;if(modalKind==='ai')openAIKey('La clave no es válida o ha caducado. Escribe una nueva.');return}
    ai.status='error';ai.err=aiErr(err);
  }
  ai.ctrl=null;
  if(modalKind==='ai')renderAI();
  else if(ai.status==='done')toast(`La IA ha encontrado ${ai.res.length} empresa${ai.res.length===1?'':'s'}. Pulsa el botón de IA para revisarlas.`,5000);
}

      if(c.tipo==='number'){const n=parseInt(String(v).replace(/[^\d]/g,''),10);if(!isNaN(n))e[c.key]=n;return}

      e[c.key]=Array.isArray(v)?v.map(s).join(', '):s(v);

/* =====================================================================
   COMPARTIR · SERVICIO
   Toda la lógica de compartir pasa por el objeto SHARING. La interfaz solo
   llama a los métodos de SharingService y escucha sus cambios.
   Para conectarlo a un servidor real: crea una clase que extienda

   Persona = {
     id:      string,

const ROLES={propietario:'Propietario',editor:'Puede editar',lector:'Solo puede ver'};
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
class SharingService{
  constructor(){this._fns=new Set()}
  /** Qué permite la implementación. @returns {{demo:boolean, puedeInvitar:boolean, enlace:boolean, motivo?:string}} */
  capacidades(){throw new Error('No implementado')}
  /** Usuario actual. @returns {Promise<Persona>} */
  async yo(){throw new Error('No implementado')}
  /** Cambia el nombre visible del usuario actual. */
  async cambiarMiNombre(nombre){throw new Error('No implementado')}
  /** Personas con acceso, incluidas las invitaciones pendientes. @returns {Promise<Persona[]>} */
  async miembros(){throw new Error('No implementado')}

  async invitar(emails,rol){throw new Error('No implementado')}

  async cambiarRol(id,rol){throw new Error('No implementado')}
  /** Quita a un miembro o cancela una invitación pendiente. */
  async quitar(id){throw new Error('No implementado')}
  /** Vuelve a enviar una invitación pendiente. */
  async reenviar(id){throw new Error('No implementado')}
  /** El usuario actual deja el tablero (no disponible para el propietario). */
  async salir(){throw new Error('No implementado')}
  /** El propietario pasa la propiedad a otro miembro activo; él pasa a editor. */
  async transferirPropiedad(id){throw new Error('No implementado')}

  usarEmbudo(id){this.embudo=id}

  async participantes(id){throw new Error('No implementado')}
  /** Tableros que otras personas han compartido conmigo.
      @returns {Promise<{id:string, nombre:string, de:{nombre:string,email:string}, rol:'editor'|'lector'}[]>} */
  async embudosCompartidos(){throw new Error('No implementado')}
  /** Enlace de invitación del tablero. @returns {Promise<{activo:boolean, url?:string, rol?:'editor'|'lector'}>} */
  async enlace(){throw new Error('No implementado')}
  /** Crea o actualiza el enlace de invitación con ese rol. @returns {Promise<{activo:true, url:string, rol:string}>} */
  async activarEnlace(rol){throw new Error('No implementado')}
  /** Desactiva el enlace: quien lo tenga ya no podrá unirse. */
  async desactivarEnlace(){throw new Error('No implementado')}
  /** Invitación que ha recibido el usuario actual al abrir la página (por email o enlace), si la hay.
      @returns {Promise<null|{id:string, de:{nombre:string,email:string}, tablero:string, rol:'editor'|'lector'}>} */
  async invitacionRecibida(){throw new Error('No implementado')}
  /** Acepta o rechaza la invitación recibida. */
  async aceptarInvitacion(id){throw new Error('No implementado')}
  async rechazarInvitacion(id){throw new Error('No implementado')}
  /** Escucha cambios (de este usuario o de otros). Devuelve una función para dejar de escuchar. */
  suscribir(fn){this._fns.add(fn);return ()=>this._fns.delete(fn)}
  /** Las implementaciones llaman a esto cuando algo cambia. */
  _emitir(){this._fns.forEach(f=>{try{f()}catch(e){}})}
}

    const k=id&&id!=='principal'?this.BASE+':'+id:this.BASE;let otros=[];try{otros=JSON.parse(localStorage.getItem(k)||'[]')||[]}catch(e){}
    const y=await LocalSharing.prototype.yo.call(this),c=esCompartido(id)?this._recibidos().find(r=>'sh:'+r.id===id):null;

/* ---------- Toast ---------- */
let toastT;
function toast(m,ms=2600,act){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(m)}</span>${act?`<button class="toast-btn">${esc(act.label)}</button>`:''}`;
  if(act)t.querySelector('button').onclick=()=>{t.hidden=true;act.fn()};
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);
}

/* ---------- Tooltips propios ---------- */
let tipEl=null,tipT;
function tipShow(el){
  const t=$('#tip');if(!el.isConnected||!el.dataset.tip)return;
  t.textContent=el.dataset.tip;t.hidden=false;
  const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  let x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)),y=r.top-h-8;
  if(y<8)y=r.bottom+8;
  t.style.left=x+'px';t.style.top=y+'px';
}
function tipHide(){clearTimeout(tipT);tipEl=null;$('#tip').hidden=true}
function tipTarget(node){
  const el=node&&node.closest?node.closest('[title],[data-tip]'):null;
  if(el&&el.hasAttribute('title')){const v=el.getAttribute('title');el.removeAttribute('title');if(v)el.dataset.tip=v}
  return el&&el.dataset.tip?el:null;
}
document.addEventListener('pointerover',ev=>{
  const el=tipTarget(ev.target);if(el===tipEl)return;tipHide();
  if(!el||ev.pointerType==='touch')return;
  tipEl=el;tipT=setTimeout(()=>tipShow(el),450);
});
document.addEventListener('pointerout',ev=>{if(!ev.relatedTarget)tipHide()});
document.addEventListener('focusin',ev=>{
  const el=tipTarget(ev.target);tipHide();
  if(el&&ev.target.matches(':focus-visible')){tipEl=el;tipShow(el)}
});
['focusout','pointerdown','dragstart','scroll','keydown'].forEach(t=>document.addEventListener(t,tipHide,true));
