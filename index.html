<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Embudo de empresas FFE</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E6B5A"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Embudo FFE"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: herramienta de trabajo. Cabecera + franja de resumen + tres vistas (embudo, lista, agenda) + ficha lateral + ventanas de configurar e importar. */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --sunken:#E9EEEE; --ink:#14211F; --muted:#5B6B69; --line:#D6DFDE;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --danger:#B42318; --danger-soft:#FDE8E6; --warn:#A35200; --warn-soft:#FFF0DC; --ok:#0B7A43; --ok-soft:#DFF3E7;
  --ramp-start:#B9C6C4; --ramp-end:#0E5A48; --closed:#9AA3A2;
  --shadow:0 1px 2px rgba(20,33,31,.06),0 4px 14px rgba(20,33,31,.06);
  --overlay:rgba(14,24,22,.35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#151D1C; --sunken:#1B2524; --ink:#E4ECEA; --muted:#93A6A2; --line:#283432;
  --accent:#4CC2A4; --accent-ink:#06231C; --accent-soft:#16332C;
  --danger:#FF8A7A; --danger-soft:#3A1A17; --warn:#F5B25C; --warn-soft:#352614; --ok:#5FD39A; --ok-soft:#12301F;
  --ramp-start:#4A5755; --ramp-end:#5FD3B2; --closed:#5E6867;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151D1C; --sunken:#1B2524; --ink:#E4ECEA; --muted:#93A6A2; --line:#283432;
  --accent:#4CC2A4; --accent-ink:#06231C; --accent-soft:#16332C;
  --danger:#FF8A7A; --danger-soft:#3A1A17; --warn:#F5B25C; --warn-soft:#352614; --ok:#5FD39A; --ok-soft:#12301F;
  --ramp-start:#4A5755; --ramp-end:#5FD3B2; --closed:#5E6867;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;margin:0 auto}

/* Cabecera */
header.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand .curso{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative}
.search input{width:220px;max-width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
select.sel,.m-body select,.m-body input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Aviso de ejemplo */
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13px;margin-bottom:12px}
.notice b{color:var(--warn)}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
button.stat:hover{border-color:var(--muted)}
.stat .n{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.stat.alert .n{color:var(--danger)}
.stat.today .n{color:var(--warn)}
.stat.good .n{color:var(--ok)}

/* Pestañas */
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;align-items:flex-end}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--danger-soft);color:var(--danger);padding:1px 6px;border-radius:99px;margin-left:4px}
nav.tabs .spacer{flex:1}
nav.tabs .btn{margin-bottom:6px}

/* Embudo */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:10px;overflow-x:auto;padding-bottom:16px;align-items:start}
.col{background:var(--sunken);border-radius:var(--r);display:flex;flex-direction:column;min-height:180px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--pc);border-radius:var(--r) var(--r) 0 0}
.col-h .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-h .t{font-weight:600;font-size:13.5px}
.col-h .step{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.col-h .c{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.col-h .h{font-size:12px;color:var(--muted)}
.col-h[draggable="true"]{cursor:grab}
.col-h[draggable="true"]:active{cursor:grabbing}
.col-h .rt{display:inline-flex;align-items:center;gap:2px;margin:-5px -6px -5px 0}
.col-h .rt .c{margin-right:4px}
.col-del{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:var(--muted);padding:0}
.col-del.col-add:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;line-height:1.35;padding:5px 9px;border-radius:6px;max-width:260px;box-shadow:var(--shadow)}
.toast{display:flex;gap:14px;align-items:center}
.toast-btn{background:none;border:0;padding:0;color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.btn.icon{padding:8px 10px}
.hist{display:inline-flex;gap:4px}
.col{position:relative}
.board{padding-right:22px}
.ins{position:absolute;top:11px;left:-15px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;z-index:2;opacity:0;transition:opacity .15s,transform .15s;box-shadow:var(--shadow)}
.ins svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.ins.end{left:auto;right:-15px}
.board:hover .ins,.ins:focus-visible{opacity:1}
.ins:hover{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);transform:scale(1.15)}
@media (hover:none){.ins{opacity:1}}
.col-name{font:inherit;font-weight:600;font-size:13.5px;flex:1;min-width:0;padding:2px 6px;margin:-3px 0 -3px -7px;border:1px solid var(--accent);border-radius:6px;background:var(--surface)}
.tab-cfg{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;margin:0 8px 5px -4px;display:inline-flex;align-self:center}
.tab-cfg svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-cfg:hover{color:var(--accent);background:var(--accent-soft)}
th .arr{color:var(--accent)}
.th-name{font:inherit;font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;padding:3px 6px;margin:-4px 0;border:1px solid var(--accent);border-radius:5px;width:100%;min-width:110px;background:var(--surface);color:var(--ink)}
.ai-row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.ai-q{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);resize:vertical}
.ai-max{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.ai-res{min-width:640px}
.ai-res td{vertical-align:top}
.ai-res tbody tr{cursor:default}
.ai-res .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ai-res a{color:var(--accent)}
.tag-dup{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.spin{width:16px;height:16px;flex:none;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.ghost{position:fixed;z-index:80;pointer-events:none;margin:0;cursor:grabbing;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:rotate(2deg) scale(1.04);opacity:.96}
.card-act{display:inline-flex;align-items:center;gap:4px;flex:none}
.card-del{width:24px;height:24px;margin:-4px -6px -4px 0;border:0;border-radius:6px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.card-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-del:hover{background:var(--danger-soft);color:var(--danger)}
header.top{position:sticky;top:0;z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));transition:box-shadow .2s,padding .2s}
header.top.stuck{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(20,33,31,.08);padding-bottom:10px}
.fb-opts{display:flex;flex-wrap:wrap;gap:6px}
.fb-opts button,.fb-scale button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px}
.fb-opts button[aria-checked="true"],.fb-scale button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fb-scale{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb-scale span{font-size:12px;color:var(--muted)}
.fb-scale button{width:38px;height:38px;padding:0;border-radius:50%;font-weight:600}
#fb-t{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%;resize:vertical;min-height:110px}
a.copy{display:inline-flex;align-items:center;justify-content:center;min-width:38px;text-decoration:none;color:var(--accent)}
.item-act{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.act-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--accent);text-decoration:none}
.act-ic:hover{border-color:var(--accent);background:var(--accent-soft)}
.act-ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (pointer:coarse){.act-ic{width:42px;height:42px}}
@media (max-width:640px){.item-act{justify-content:flex-start}}
a.copy svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qbtn{display:none}
.phase-nav{display:none}
@media (max-width:640px){
  .stats{display:flex;overflow-x:auto;gap:8px;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{flex:none;flex-direction:row;align-items:baseline;gap:6px;padding:6px 12px;border-radius:99px}
  .stat .n{font-size:17px}
  .stat .l{font-size:12px;white-space:nowrap}
  header.top.stuck{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;gap:8px}
  header.top.stuck .brand{display:none}
  header.top.stuck .tools{width:100%;justify-content:space-between;gap:4px}
  header.top.stuck .search{display:none}
  header.top.stuck.qopen .search{display:block;flex:1 1 100%;order:-1}
  header.top.stuck .qbtn{display:inline-flex}
  header.top.stuck.qopen .qbtn{display:none}
  .board{grid-auto-columns:calc(100% - 28px);scroll-snap-type:x mandatory;margin-inline:-16px;padding-left:16px;padding-right:28px;scroll-padding-left:16px}
  .col{scroll-snap-align:start}
  .ins{display:none!important}
  .phase-nav{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 2px;scrollbar-width:none}
  .phase-nav::-webkit-scrollbar{display:none}
  .phase-nav button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-size:13px;white-space:nowrap;min-height:38px}
  .phase-nav button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
  .phase-nav button.add{border-style:dashed;color:var(--muted)}
  .phase-nav button.add::before{display:none}
  .phase-nav button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .phase-nav .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
}
@media (pointer:coarse){
  .col-del,.card-del{width:40px;height:40px}
  .card-del{margin:-10px -10px -10px 0}
  .col-h .rt{margin:-10px -8px -10px 0}
  .tab-cfg{padding:10px;margin:0 2px 0 -8px}
  .btn.icon{padding:10px 11px}
  .copy{padding:0 12px;min-height:40px}
}
.drop-line{flex:none;height:3px;margin:-5.5px 2px;border-radius:2px;background:var(--accent)}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:3px;font-weight:600}
.fmt button span{font-weight:400;font-size:12.5px;color:var(--muted)}
.fmt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.radios{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.radios label,.chkline{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13.5px}
.radios input,.chkline input{accent-color:var(--accent);margin:0}
@media (max-width:640px){.fmt{grid-template-columns:1fr}}
.col-del svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.col-del:hover:not(:disabled){background:var(--danger-soft);color:var(--danger)}
.col.col-dragging{opacity:.4}
.col.drop-before{box-shadow:inset 4px 0 0 var(--accent)}
.col.drop-after{box-shadow:inset -4px 0 0 var(--accent)}
.col-confirm{margin:0 8px 8px;padding:10px;border-radius:8px;background:var(--danger-soft);display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.col-confirm select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%}
.col-confirm .row{display:flex;gap:6px;flex-wrap:wrap}
.add-col{background:transparent;border:1.5px dashed var(--line);border-radius:var(--r);min-height:180px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.add-col:hover{border-color:var(--accent);color:var(--accent)}
.cards{display:flex;flex-direction:column;gap:8px;padding:4px 8px 10px;flex:1}
.empty-col{font-size:12px;color:var(--muted);padding:10px 6px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;box-shadow:var(--shadow);text-align:left;min-width:0}
.card:hover{border-color:var(--muted)}
.card.dragging{opacity:.45}
.card .name{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .sector{font-size:12px;color:var(--muted)}
.plz{font-family:var(--f-mono);font-size:11px;white-space:nowrap;color:var(--muted);background:var(--sunken);padding:2px 6px;border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.next{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;border-top:1px solid var(--line);padding-top:6px}
.next .txt{min-width:0;overflow-wrap:anywhere}
.due{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:5px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.due.vencida,.due.none{background:var(--danger-soft);color:var(--danger)}
.due.hoy{background:var(--warn-soft);color:var(--warn)}
.due.semana{background:var(--accent-soft);color:var(--accent)}
.motivo{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;overflow-wrap:anywhere}

/* Lista */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunken);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
th button[aria-sort]::after{content:" ↓"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunken)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.long{max-width:260px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.list-tools{display:flex;justify-content:flex-end;margin-bottom:8px}

/* Agenda */
.agenda{display:grid;gap:18px;max-width:900px}
.group h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.group h2 .c{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.group.vencida h2,.group.none h2{color:var(--danger)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .main button{all:unset;cursor:pointer;font-weight:600}
.item .main button:hover{text-decoration:underline}
.item .main .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.item .act{overflow-wrap:anywhere}
.group .hint{font-size:12.5px;color:var(--muted);margin:-4px 0 8px}
.nothing{color:var(--muted);font-size:13px;padding:12px}

/* Ficha lateral */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.d-head input{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:700;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin-left:-6px;background:transparent}
.d-head input:hover,.d-head input:focus{border-color:var(--line)}
.d-body{overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:20px;flex:1}
.d-sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.stepper{display:grid;gap:3px}
.stepper button{border:0;padding:0;height:8px;border-radius:3px;background:var(--line)}
.stepper button.done{background:var(--pc)}
.stepper-label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.stepper-label .cur{font-weight:600}
.phase-select{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.phase-select button{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.phase-select button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phase-select .sep{width:100%;height:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.field .lab{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--surface);width:100%}
.field textarea{resize:vertical;min-height:70px}
.with-copy{display:flex;gap:6px}
.with-copy input{flex:1;min-width:0}
.copy{border:1px solid var(--line);background:var(--sunken);border-radius:7px;padding:0 9px;font-size:12px;color:var(--muted)}
.ciclos{display:flex;flex-wrap:wrap;gap:6px}
.ciclos label{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink)}
.ciclos input{margin:0;accent-color:var(--accent);width:auto}
.ciclos label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.next-box{background:var(--accent-soft);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr 150px;gap:10px}
.next-box.missing{background:var(--danger-soft)}
.next-box .warn{grid-column:1/-1;font-size:12.5px;color:var(--danger);font-weight:500}
.motivo-box{background:var(--warn-soft);border-radius:var(--r);padding:12px}
.motivo-box.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:0 0 0 0 transparent}}
.log-add{display:flex;flex-direction:column;gap:8px}
.log-add .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.log .d{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.log .sys{color:var(--muted);font-style:italic}
.d-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:12px}

/* Ventanas (configurar / importar) */
.moverlay{position:fixed;inset:0;background:var(--overlay);z-index:40}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 24px));max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;gap:12px}
.m-head h2{font-family:var(--f-display);font-size:20px;margin:0}
.m-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.m-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;margin-bottom:-1px;color:var(--muted);font-weight:500}
.m-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.m-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.m-hint{margin:0;color:var(--muted);font-size:13px;max-width:65ch}
.cfg-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.cfg-row{display:grid;grid-template-columns:6px 56px minmax(120px,1.2fr) minmax(120px,1.4fr) 150px 70px auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.cfg-row:last-child{border-bottom:0}
.cfg-row.campo{grid-template-columns:56px minmax(140px,1.5fr) 130px 150px 90px auto}
.cfg-row .sw{width:6px;align-self:stretch;border-radius:3px;background:var(--pc)}
.cfg-row input[type=text],.cfg-row select{width:100%;min-width:0}
.cfg-row .mv{display:flex;gap:2px}
.cfg-row .mv button{width:26px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0;font-size:13px}
.cfg-row .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.cfg-row .fixed{font-size:12.5px;color:var(--muted)}
.cfg-row .chk{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.cfg-row .chk input{accent-color:var(--accent)}
.cfg-row .opts{grid-column:2/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.cfg-row .opts input{flex:1}
.cfg-row.del{grid-template-columns:1fr;background:var(--danger-soft)}
.cfg-row.del .confirm{font-size:13px}
.cfg-row.locked{opacity:.75}
.cfg-head{display:grid;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:0 10px}
.restore{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:32px 16px;text-align:center;cursor:pointer;background:var(--sunken)}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{font-size:15px}
.drop span{color:var(--muted);font-size:13px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.recog{font-size:12.5px;color:var(--muted);line-height:1.6}
.recog code{font-family:var(--f-mono);font-size:11.5px;background:var(--sunken);padding:1px 5px;border-radius:4px}
.map{width:100%;min-width:560px}
.map td{vertical-align:middle}
.map td.ex{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map select{width:100%}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 16px}
.err{background:var(--danger-soft);color:var(--danger);padding:8px 12px;border-radius:8px;font-size:13px}
.ok-box{background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}

@media (max-width:720px){
  .cfg-row,.cfg-row.campo{grid-template-columns:56px 1fr 1fr;}
  .cfg-row .sw{display:none}
  .cfg-row .cnt{text-align:left}
  .cfg-head{display:none}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .next-box{grid-template-columns:1fr}
  .item{grid-template-columns:1fr;gap:6px}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .stat .n{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ---------- Configuración por defecto ---------- */
const DEF_FASES=[
  {id:'identificada',label:'Identificada',hint:'Localizada, sin contactar',closed:false},
  {id:'contacto',label:'Primer contacto',hint:'Llamada hecha',closed:false},
  {id:'interesada',label:'Interesada',hint:'Información enviada',closed:false},
  {id:'reunion',label:'Reunión o visita',hint:'Cita en la empresa o en el centro',closed:false},
  {id:'tramite',label:'Convenio en trámite',hint:'Papeles en marcha',closed:false},
  {id:'firmado',label:'Convenio firmado',hint:'Lista para recibir alumnado',closed:false},
  {id:'asignado',label:'Alumnado asignado',hint:'En seguimiento',closed:false},
  {id:'descartada',label:'Descartada',hint:'Con el motivo anotado',closed:true},
  {id:'proximo',label:'Próximo curso',hint:'Volver a intentarlo',closed:true}
];
const DEF_CAMPOS=[
  {key:'sector',label:'Sector',tipo:'text',grupo:'empresa',lista:true},
  {key:'ciclos',label:'Ciclo o perfil que encaja',tipo:'ciclos',grupo:'empresa',lista:true,opciones:['SMR','ASIR','DAW','DAM']},
  {key:'plazas',label:'Plazas posibles',tipo:'number',grupo:'empresa',lista:true},
  {key:'contacto',label:'Persona de contacto',tipo:'text',grupo:'contacto',lista:true},
  {key:'cargo',label:'Cargo',tipo:'text',grupo:'contacto',lista:false},
  {key:'telefono',label:'Teléfono',tipo:'tel',grupo:'contacto',lista:true},
  {key:'email',label:'Email',tipo:'email',grupo:'contacto',lista:false},
  {key:'ultimo',label:'Último contacto',tipo:'date',grupo:'contacto',lista:true},
  {key:'notas',label:'Notas',tipo:'textarea',grupo:'notas',lista:false}
].map(c=>({...c,builtin:true,visible:true}));
const TIPOS={text:'Texto',textarea:'Texto largo',number:'Número',date:'Fecha',email:'Email',tel:'Teléfono'};
const GRUPOS={empresa:'Empresa',contacto:'Persona de contacto',otros:'Otros datos',notas:'Notas'};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- Utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY=iso(new Date());
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const days=s=>{if(!s)return null;const a=new Date(s+'T00:00:00'),b=new Date(TODAY+'T00:00:00');return Math.round((a-b)/864e5)};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmt=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return '—';const [y,m,d]=s.split('-');return `${+d} ${MES[m-1]}${y!==TODAY.slice(0,4)?' '+y.slice(2):''}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

/* ---------- Datos de ejemplo (inventados) ---------- */
function sample(){
  const E=(o)=>({id:uid(),ejemplo:true,cargo:'',plazas:1,notas:'',motivo:'',historial:[],...o});
  return [
    E({nombre:'Kodeo Labs',sector:'Desarrollo de software',ciclos:['DAW','DAM'],contacto:'Marta Iriarte',cargo:'Responsable de RR. HH.',telefono:'948 112 340',email:'rrhh@kodeo.example',plazas:3,estado:'asignado',ultimo:off(-6),accion:'Visita de seguimiento con la tutora de empresa',accionFecha:off(4),notas:'Dos alumnos de DAW y uno de DAM desde el 2 de noviembre. Muy buena acogida.',historial:[{fecha:off(-6),texto:'Llamada de seguimiento: todo bien, piden repetir el curso que viene.'},{fecha:off(-40),texto:'Convenio firmado.'}]}),
    E({nombre:'Datanorte Consultores',sector:'Consultoría IT',ciclos:['ASIR','SMR'],contacto:'Iker Salaverri',cargo:'Jefe de sistemas',telefono:'943 551 208',email:'iker.s@datanorte.example',plazas:2,estado:'firmado',ultimo:off(-3),accion:'Enviar perfiles de dos alumnos de ASIR',accionFecha:off(-1),notas:'Prefieren alumnado con interés en redes y Linux.',historial:[{fecha:off(-3),texto:'Convenio firmado por ambas partes.'}]}),

function bindBoard(){
  $$('.card').forEach(c=>{
    c.addEventListener('dragstart',ev=>{if(TD){ev.preventDefault();return}ev.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging')});
    c.addEventListener('dragend',()=>{c.classList.remove('dragging');$('#dropline')?.remove()});
    bindTouch(c);
  });
  // Arrastrar columnas enteras desde su cabecera
  const clearCol=()=>$$('.col').forEach(c=>c.classList.remove('drop-before','drop-after','col-dragging','over'));
  $$('.col-h[data-colh]').forEach(h=>{
    h.addEventListener('dragstart',ev=>{
      dragCol=h.dataset.colh;ev.dataTransfer.effectAllowed='move';
      try{ev.dataTransfer.setData('application/x-col',dragCol)}catch(e){}
      h.closest('.col').classList.add('col-dragging');
    });
    h.addEventListener('dragend',()=>{dragCol=null;clearCol()});
  });
  // Papelera de cada columna
  $$('[data-coldel]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();removeFase(b.dataset.coldel)});
  $$('[data-del-emp]').forEach(b=>{
    b.onclick=ev=>{ev.stopPropagation();deleteEmpresa(b.dataset.delEmp,b.closest('.card'))};
    b.addEventListener('touchstart',ev=>ev.stopPropagation(),{passive:true});
  });
  $$('[data-coladd]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();nuevaEmpresa(b.dataset.coladd)});
  // + entre columnas
  $$('[data-ins]').forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const i=+b.dataset.ins,l=S.fases[i-1],r=S.fases[i];
    const f={id:'f_'+uid(),label:'Columna nueva',hint:'',closed:!!((l?l.closed:true)&&(r?r.closed:true))};
    S.fases.splice(i,0,f);save();renamingCol=f.id;renderAll();
  });
  // Cambiar el nombre en la propia columna
  $$('#view .col-h .t').forEach(t=>t.ondblclick=()=>{renamingCol=t.closest('.col').dataset.col;renderBoard()});
  const rn=$('#view [data-rename]');
  if(rn){
    rn.focus();rn.select();let done=false;
    const commit=cancel=>{if(done)return;done=true;const f=fase(rn.dataset.rename);renamingCol=null;if(f&&!cancel){f.label=rn.value.trim()||f.label||'Columna nueva';save({quiet:true})}renderAll()};
    rn.onkeydown=ev=>{if(ev.key==='Enter')commit();else if(ev.key==='Escape'){ev.stopPropagation();commit(true)}};
    rn.onblur=()=>commit();
    rn.onmousedown=ev=>ev.stopPropagation();
  }
  $$('[data-coldelok]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.coldelok,to=$('#coldel-to').value,l=label(id);
    S.empresas.filter(e=>e.estado===id).forEach(e=>setEstado(e,to));
    S.fases=S.fases.filter(f=>f.id!==id);colDel=null;save();renderAll();
    toast(`Columna «${l}» quitada. Empresas movidas a «${label(to)}»`);
  });
  $$('[data-coldelno]').forEach(b=>b.onclick=()=>{colDel=null;renderBoard()});
  $$('.col').forEach(col=>{
    col.addEventListener('dragover',ev=>{
      ev.preventDefault();
      if(dragCol){
        const r=col.getBoundingClientRect(),before=ev.clientX<r.left+r.width/2;
        col.classList.toggle('drop-before',before);col.classList.toggle('drop-after',!before);return;
      }
      col.classList.add('over');
      const box=col.querySelector('.cards');if(!box)return;
      const before=[...box.querySelectorAll('.card:not(.dragging)')].find(c=>{const r=c.getBoundingClientRect();return ev.clientY<r.top+r.height/2})||null;
      let line=$('#dropline');
      if(!line){line=document.createElement('div');line.id='dropline';line.className='drop-line'}
      if(line.parentNode!==box||line.nextElementSibling!==before)box.insertBefore(line,before);
    });
    col.addEventListener('dragleave',ev=>{if(!col.contains(ev.relatedTarget)){col.classList.remove('over','drop-before','drop-after');const l=$('#dropline');if(l&&col.contains(l))l.remove()}});
    col.addEventListener('drop',ev=>{
      ev.preventDefault();
      if(dragCol){
        const before=col.classList.contains('drop-before'),target=col.dataset.col,src=dragCol;
        dragCol=null;clearCol();if(target===src)return;
        const [f]=S.fases.splice(S.fases.findIndex(x=>x.id===src),1);
        let at=S.fases.findIndex(x=>x.id===target);if(!before)at++;
        S.fases.splice(at,0,f);save();renderAll();toast(`Columna «${f.label}» movida`);return;
      }
      col.classList.remove('over');
      const line=$('#dropline'),nx=line&&col.contains(line)?line.nextElementSibling:null;
      const beforeId=nx&&nx.classList.contains('card')?nx.dataset.id:null;
      if(line)line.remove();
      const e=byId(ev.dataTransfer.getData('text/plain'));if(!e)return;
      const to=col.dataset.col;
      if(!moveCard(e,to,beforeId))return;
      if(isClosed(to))openDrawer(e.id,'motivo');else toast(`${e.nombre} → ${label(to)}`);
    });
  });
}

/* ---------- Lista ---------- */
function cellHTML(c,e){
  const v=e[c.key];
  if(c.tipo==='ciclos')return `<td><div class="chips">${(v||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></td>`;
  if(c.tipo==='date')return `<td class="num">${fmt(v)}</td>`;
  if(c.tipo==='number')return `<td class="num">${v===''||v==null?'—':esc(v)}</td>`;
  if(c.tipo==='tel')return `<td class="num">${esc(v)||'—'}</td>`;
  if(c.tipo==='textarea'){const s=String(v||'');return `<td class="long">${esc(s.length>90?s.slice(0,90)+'…':s)||'—'}</td>`}
  return `<td>${esc(v)||'—'}</td>`;
}
const DEF_ETQ={nombre:'Empresa',estado:'Fase',accion:'Próxima acción',accionFecha:'Fecha'};
const etq=k=>(S.etq&&S.etq[k])||DEF_ETQ[k];
function renderList(){
  const cols=S.campos.filter(c=>c.visible&&c.lista);
  const order=id=>S.fases.findIndex(f=>f.id===id);
  const list=filtered().slice().sort((a,b)=>{
    const k=sortKey,c=campo(k);
    if(k==='estado')return sortDir*(order(a.estado)-order(b.estado));
    const g=x=>{const v=x[k];return Array.isArray(v)?v.join(', '):v};
    const va=g(a),vb=g(b),ea=va===''||va==null,eb=vb===''||vb==null;
    if(ea||eb)return ea===eb?0:ea?1:-1;
    if(c&&c.tipo==='number')return sortDir*((+va||0)-(+vb||0));
    return sortDir*String(va).localeCompare(String(vb),'es',{numeric:true});
  });
  const th=(k,t,ed)=>`<th ${sortKey===k?`aria-sort="${sortDir>0?'ascending':'descending'}"`:''}>${editingTh===k?`<input class="th-name" data-thedit="${k}" value="${esc(t)}" aria-label="Nombre del campo">`:`<button data-sort="${k}" ${ed?'data-ed="1"':''} data-tip="${ed?'Clic: ordenar · Doble clic: cambiar el nombre':'Clic: ordenar'}">${esc(t)}<span class="arr">${sortKey===k?(sortDir>0?' ↑':' ↓'):''}</span></button>`}</th>`;
  $('#view').innerHTML=`<div class="table-wrap"><table>
    <thead><tr>${th('nombre',etq('nombre'),true)}${th('estado',etq('estado'),true)}${cols.map(c=>th(c.key,c.label,true)).join('')}${th('accion',etq('accion'),true)}${th('accionFecha',etq('accionFecha'),true)}</tr></thead>
    <tbody>${list.map(e=>{const d=dueInfo(e);return `<tr data-id="${e.id}" tabindex="0">
      <td><strong>${esc(e.nombre)}</strong></td>
      <td><span class="pill" style="--pc:${pcolor(e.estado)}">${esc(label(e.estado))}</span></td>
      ${cols.map(c=>cellHTML(c,e)).join('')}
      <td>${isClosed(e.estado)?`<span style="color:var(--muted)">${esc(e.motivo)}</span>`:(esc(e.accion)||'<i style="color:var(--danger)">Sin próxima acción</i>')}</td>
      <td>${d?`<span class="due ${d.cls}">${d.txt}</span>`:''}</td>
    </tr>`}).join('')||`<tr><td colspan="${cols.length+4}" class="nothing">No hay empresas con ese filtro.</td></tr>`}</tbody>
  </table></div>`;
  let clickT;
  $$('th button[data-sort]').forEach(b=>{
    b.onclick=()=>{
      clearTimeout(clickT);const k=b.dataset.sort;
      clickT=setTimeout(()=>{if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}renderList()},b.dataset.ed?240:0);
    };
    b.ondblclick=()=>{clearTimeout(clickT);if(!b.dataset.ed)return;editingTh=b.dataset.sort;renderList()};
  });
  const ti=$('#view [data-thedit]');
  if(ti){
    ti.focus();ti.select();let done=false;
    const commit=cancel=>{
      if(done)return;done=true;const k=ti.dataset.thedit,c=campo(k),v=ti.value.trim();editingTh=null;
      if(!cancel&&v){
        if(c){if(v!==c.label){c.label=v;save()}}
        else if(k in DEF_ETQ&&v!==etq(k)){S.etq={...(S.etq||{}),[k]:v};save()}
      }
      renderAll();
    };
    ti.onkeydown=ev=>{if(ev.key==='Enter')commit();else if(ev.key==='Escape'){ev.stopPropagation();commit(true)}};
    ti.onblur=()=>commit();
    ti.onclick=ev=>ev.stopPropagation();
  }
  $$('tbody tr[data-id]').forEach(r=>{
    r.onclick=()=>openDrawer(r.dataset.id);
    r.onkeydown=ev=>{if(ev.key==='Enter')openDrawer(r.dataset.id)};
  });
}

    {id:'vencida',t:'Vencidas',hint:'Tenías que haberlo hecho ya.',f:e=>e.accionFecha&&days(e.accionFecha)<0},
    {id:'hoy',t:'Hoy',f:e=>e.accionFecha&&days(e.accionFecha)===0},
    {id:'semana',t:'Próximos 7 días',f:e=>{const n=days(e.accionFecha);return e.accionFecha&&n>0&&n<=7}},
    {id:'luego',t:'Más adelante',f:e=>e.accionFecha&&days(e.accionFecha)>7},

        </div>

const byId=id=>S.empresas.find(e=>e.id===id);
function setEstado(e,to,keep){
  const from=e.estado;if(from===to)return;
  e.estado=to;if(!keep)delete e.pos;
  (e.historial=e.historial||[]).unshift({fecha:TODAY,texto:`${label(from)} → ${label(to)}`,sys:true});
  if(isClosed(to)){e.accion='';e.accionFecha=''}
  save();renderAll();
}

function bindDrawer(e){
  $('#cerrar').onclick=()=>closeDrawer();
  $('#cfgfields').onclick=()=>openConfig('campos');
  $('#f-nombre').oninput=ev=>{e.nombre=ev.target.value;quietSave()};
  $$('#drawer [data-k]').forEach(el=>el.addEventListener('input',()=>{
    const k=el.dataset.k,c=campo(k);
    e[k]=c&&c.tipo==='number'?(el.value===''?'':Math.max(0,+el.value||0)):el.value;
    if(k==='accionFecha'){const b=$('#next-box');b.classList.toggle('missing',!el.value);b.querySelector('.warn').hidden=!!el.value}
    const al=$(`#drawer [data-act="${el.id}"]`);if(al){al.href=actHref(al.dataset.kind,el.value);al.hidden=!el.value.trim()}
    quietSave();
  }));
  $$('#drawer [data-multi]').forEach(cb=>cb.onchange=()=>{
    const k=cb.dataset.multi;e[k]=[...$$(`#drawer [data-multi="${k}"]:checked`)].map(x=>x.value);quietSave();
  });
  $$('#drawer [data-ph]').forEach(b=>b.onclick=()=>{
    const to=b.dataset.ph;if(to===e.estado)return;
    setEstado(e,to);openDrawer(e.id,isClosed(to)?'motivo':'accion');
  });
  $('#addlog').onclick=()=>{
    const t=$('#f-log').value.trim();if(!t){$('#f-log').focus();return}
    (e.historial=e.historial||[]).unshift({fecha:TODAY,texto:t});if(visible('ultimo'))e.ultimo=TODAY;
    save();renderAll();openDrawer(e.id,isClosed(e.estado)?null:'accion');toast('Contacto registrado. Revisa la próxima acción.');
  };
  $$('#drawer [data-copy]').forEach(b=>b.onclick=()=>{
    const inp=$('#'+b.dataset.copy);if(!inp.value)return;
    const done=()=>{b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1400)};
    try{navigator.clipboard.writeText(inp.value).then(done,()=>inp.select())}catch(err){inp.select()}
  });
  $('#borrar').onclick=()=>{
    S.empresas=S.empresas.filter(x=>x.id!==e.id);const rec=save();closeDrawer(true);
    toast(`«${e.nombre||'Empresa'}» eliminada`,6000,rec?UNDO:null);
  };
}
let saveT;
function quietSave(){save({quiet:true});clearTimeout(saveT);const s=$('#saved');if(s)s.textContent='Guardado';saveT=setTimeout(()=>{renderAll();const s2=$('#saved');if(s2)s2.textContent='Los cambios se guardan solos'},600)}
function closeDrawer(skip){

const count=id=>S.empresas.filter(e=>e.estado===id).length;
function fasesCfg(){
  const nAct=activas().length;
  const rows=S.fases.map((f,i)=>{
    const n=count(f.id);
    if(pendingDel===f.id){
      const others=S.fases.filter(o=>o.id!==f.id);

    }

      <span class="sw"></span>
      <div class="mv"><button data-up="${i}" ${i===0?'disabled':''} aria-label="Subir ${esc(f.label)}">↑</button><button data-down="${i}" ${i===S.fases.length-1?'disabled':''} aria-label="Bajar ${esc(f.label)}">↓</button></div>

      <select id="ft-${f.id}" data-ft="${f.id}" aria-label="Tipo de columna" ${last?'disabled':''}><option value="0">En curso</option><option value="1" ${f.closed?'selected':''}>Cierre (pide motivo)</option></select>
      <span class="cnt">${n} emp.</span>
      <button class="btn sm" data-del="${f.id}" ${last?'disabled title="Tiene que quedar al menos una columna en curso"':''}>Quitar</button>
    </div>`;
  }).join('');
  const missing=DEF_FASES.filter(d=>!S.fases.some(f=>f.id===d.id));
  return `<p class="m-hint">Cada columna es una fase del embudo, en el orden en que las recorre una empresa. Las de tipo <b>cierre</b> piden el motivo y no aparecen en la agenda.</p>
    <div class="cfg-head cfg-row" style="border:0;padding-block:0"><span></span><span>Orden</span><span>Nombre</span><span>Descripción</span><span>Tipo</span><span>Empresas</span><span></span></div>
    <div class="cfg-list">${rows}</div>
    <div><button class="btn sm primary" id="addfase">+ Añadir columna</button></div>
    ${missing.length?`<div class="restore"><span>Columnas por defecto que has quitado:</span>${missing.map(d=>`<button class="btn sm" data-restore-f="${d.id}">+ ${esc(d.label)}</button>`).join('')}</div>`:''}`;
}
function camposCfg(){
  const shown=S.campos.filter(c=>c.visible||!c.builtin);
  const rows=shown.map(c=>{
    const i=S.campos.indexOf(c);
    const used=S.empresas.filter(e=>e[c.key]!==undefined&&e[c.key]!==''&&!(Array.isArray(e[c.key])&&!e[c.key].length)).length;
    if(pendingDel===c.key)return `<div class="cfg-row del"><div class="confirm"><span>Se borrará «${esc(c.label)}» y lo que tenga escrito en ${used} empresa${used===1?'':'s'}.</span>
      <button class="btn sm danger" data-cdelok="${c.key}">Borrar campo</button><button class="btn sm" data-delno>Cancelar</button></div></div>`;
    return `<div class="cfg-row campo">
      <div class="mv"><button data-cup="${i}" aria-label="Subir ${esc(c.label)}">↑</button><button data-cdown="${i}" aria-label="Bajar ${esc(c.label)}">↓</button></div>
      <input type="text" id="cl-${c.key}" data-cl="${c.key}" value="${esc(c.label)}" aria-label="Nombre del campo">
      ${c.builtin?`<span class="fixed">${c.tipo==='ciclos'?'Opciones':TIPOS[c.tipo]}</span>`:`<select id="ct-${c.key}" data-ct="${c.key}" aria-label="Tipo de dato">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${c.tipo===k?'selected':''}>${t}</option>`).join('')}</select>`}
      <select id="cg-${c.key}" data-cg="${c.key}" aria-label="Sección de la ficha">${Object.entries(GRUPOS).map(([k,t])=>`<option value="${k}" ${(c.grupo||'otros')===k?'selected':''}>${t}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="cli-${c.key}" data-cli="${c.key}" ${c.lista?'checked':''}> En la lista</label>
      <button class="btn sm" data-cdel="${c.key}">Quitar</button>
      ${c.tipo==='ciclos'?`<div class="opts"><label for="co-${c.key}">Opciones:</label><input type="text" id="co-${c.key}" data-co="${c.key}" value="${esc((c.opciones||[]).join(', '))}" placeholder="SMR, ASIR, DAW, DAM"></div>`:''}
    </div>`;
  }).join('');
  const missing=S.campos.filter(c=>c.builtin&&!c.visible);
  return `<p class="m-hint">Los campos son los datos que guardas de cada empresa. Aparecen en la ficha, en la sección que elijas, y en la lista si marcas «En la lista». El nombre, la próxima acción, el motivo y el historial siempre están.</p>
    <div class="cfg-head cfg-row campo" style="border:0;padding-block:0"><span>Orden</span><span>Nombre</span><span>Tipo</span><span>Sección</span><span></span><span></span></div>
    <div class="cfg-list">
      <div class="cfg-row campo locked"><span></span><span>Nombre de la empresa</span><span class="fixed">Texto</span><span class="fixed">Cabecera</span><span class="fixed">Siempre</span><span></span></div>
      ${rows}
    </div>
    <div><button class="btn sm primary" id="addcampo">+ Añadir campo</button></div>
    ${missing.length?`<div class="restore"><span>Campos por defecto que has quitado (sus datos se conservan):</span>${missing.map(c=>`<button class="btn sm" data-restore-c="${c.key}">+ ${esc(c.label)}</button>`).join('')}</div>`:''}`;
}
function afterCfg(rerender=true){save({quiet:!rerender});if(rerender)renderConfig();renderAll();if(openId)openDrawer(openId)}
function bindConfig(){
  const m=$('#modal');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  m.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cfgTab=b.dataset.tab;pendingDel=null;renderConfig()});
  // Fases
  m.querySelectorAll('[data-fl]').forEach(i=>i.oninput=()=>{fase(i.dataset.fl).label=i.value;afterCfg(false)});
  m.querySelectorAll('[data-fh]').forEach(i=>i.oninput=()=>{fase(i.dataset.fh).hint=i.value;afterCfg(false)});
  m.querySelectorAll('[data-ft]').forEach(s=>s.onchange=()=>{
    const f=fase(s.dataset.ft);f.closed=s.value==='1';
    if(f.closed)S.empresas.forEach(e=>{if(e.estado===f.id){e.accion='';e.accionFecha=''}});
    afterCfg();
  });
  const mv=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
  m.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{mv(S.fases,+b.dataset.up,-1);afterCfg()});
  m.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{mv(S.fases,+b.dataset.down,1);afterCfg()});
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeFase(b.dataset.del));
  m.querySelectorAll('[data-delok]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delok,to=$('#mv-to').value;
    S.empresas.filter(e=>e.estado===id).forEach(e=>setEstado(e,to));
    S.fases=S.fases.filter(f=>f.id!==id);pendingDel=null;afterCfg();toast(`Columna quitada. Empresas movidas a «${label(to)}»`);
  });
  m.querySelectorAll('[data-delno]').forEach(b=>b.onclick=()=>{pendingDel=null;renderConfig()});
  $('#addfase')?.addEventListener('click',()=>{
    const f={id:'f_'+uid(),label:'Columna nueva',hint:'',closed:false};
    const firstClosed=S.fases.findIndex(x=>x.closed);
    S.fases.splice(firstClosed<0?S.fases.length:firstClosed,0,f);
    afterCfg();const i=$('#fl-'+f.id);i.focus();i.select();
  });
  m.querySelectorAll('[data-restore-f]').forEach(b=>b.onclick=()=>{
    const d=DEF_FASES.find(x=>x.id===b.dataset.restoreF),di=DEF_FASES.indexOf(d);
    let pos=S.fases.findIndex(f=>{const k=DEF_FASES.findIndex(x=>x.id===f.id);return k>di});
    if(pos<0)pos=d.closed?S.fases.length:(()=>{const c=S.fases.findIndex(x=>x.closed);return c<0?S.fases.length:c})();
    S.fases.splice(pos,0,clone(d));afterCfg();
  });
  // Campos
  m.querySelectorAll('[data-cl]').forEach(i=>i.oninput=()=>{campo(i.dataset.cl).label=i.value;afterCfg(false)});
  m.querySelectorAll('[data-ct]').forEach(s=>s.onchange=()=>{campo(s.dataset.ct).tipo=s.value;afterCfg()});
  m.querySelectorAll('[data-cg]').forEach(s=>s.onchange=()=>{campo(s.dataset.cg).grupo=s.value;afterCfg(false)});
  m.querySelectorAll('[data-cli]').forEach(c=>c.onchange=()=>{campo(c.dataset.cli).lista=c.checked;afterCfg(false)});
  m.querySelectorAll('[data-co]').forEach(i=>i.onchange=()=>{campo(i.dataset.co).opciones=i.value.split(',').map(s=>s.trim()).filter(Boolean);afterCfg(false);fillCicloFilter()});
  m.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>{moveCampo(+b.dataset.cup,-1)});
  m.querySelectorAll('[data-cdown]').forEach(b=>b.onclick=()=>{moveCampo(+b.dataset.cdown,1)});
  m.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{
    const c=campo(b.dataset.cdel);
    if(c.builtin){c.visible=false;if(c.key==='ciclos'){fciclo='';fillCicloFilter()}afterCfg();toast(`«${c.label}» quitado`,6000,UNDO);return}
    S.campos=S.campos.filter(x=>x.key!==c.key);S.empresas.forEach(e=>delete e[c.key]);afterCfg();toast(`Campo «${c.label}» borrado`,6000,UNDO);
  });
  m.querySelectorAll('[data-cdelok]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.cdelok;S.campos=S.campos.filter(c=>c.key!==k);S.empresas.forEach(e=>delete e[k]);pendingDel=null;afterCfg();toast('Campo borrado');
  });
  m.querySelectorAll('[data-restore-c]').forEach(b=>b.onclick=()=>{campo(b.dataset.restoreC).visible=true;fillCicloFilter();afterCfg()});
  $('#addcampo')?.addEventListener('click',()=>{
    const c={key:'x_'+uid(),label:'Campo nuevo',tipo:'text',grupo:'otros',builtin:false,visible:true,lista:false};
    S.campos.push(c);afterCfg();const i=$('#cl-'+c.key);i.focus();i.select();
  });
}
function moveCampo(i,d){
  // mover saltando los campos quitados
  let j=i+d;while(j>=0&&j<S.campos.length&&S.campos[j].builtin&&!S.campos[j].visible)j+=d;
  if(j<0||j>=S.campos.length)return;
  [S.campos[i],S.campos[j]]=[S.campos[j],S.campos[i]];afterCfg();
}

function targets(){
  return [{v:'',t:'— No importar —'},{v:'nombre',t:'Nombre de la empresa'},
    ...S.campos.map(c=>({v:c.key,t:c.label+(c.builtin&&!c.visible?' (quitado, se volverá a mostrar)':'')})),
    {v:'estado',t:'Fase del embudo'},{v:'accion',t:'Próxima acción'},{v:'accionFecha',t:'Fecha de la próxima acción'},{v:'motivo',t:'Motivo (descarte o próximo curso)'},
    {v:'__new',t:'+ Crear un campo nuevo con este nombre'}];
}
function autoMatch(h){
  const n=norm(h);if(!n)return '';
  for(const [k,list] of Object.entries(SYN))if(list.map(norm).includes(n)&&(k in SYN))return k;
  const c=S.campos.find(c=>norm(c.label)===n);if(c)return c.key;
  return '__new';
}

function loadXLSX(){

function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length;
  const del=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inQ=false}else cur+=ch;continue}
    if(ch==='"')inQ=true;
    else if(ch===del){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
async function readFile(file){

      try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){text=new TextDecoder('windows-1252').decode(buf)}

    }else if(['xlsx','xls','ods','xlsm'].includes(ext)){
      try{await loadXLSX()}catch(e){renderImport('No se ha podido cargar el lector de Excel. Comprueba la conexión, o guarda el archivo como CSV desde Excel y súbelo así.');return}

  }catch(err){renderImport('No se ha podido leer el archivo. Si es un Excel con contraseña, quítasela o guárdalo como CSV.')}
}

function toISO(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+432e5));
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}
  return '';
}
function matchFase(v){
  const n=norm(v);if(!n)return null;
  const f=S.fases.find(f=>norm(f.label)===n||f.id===n)||S.fases.find(f=>n.length>=4&&(norm(f.label).includes(n)||n.includes(norm(f.label))));
  return f?f.id:null;
}
function doImport(){
  // campos nuevos
  const keys=imp.map.map((t,j)=>{
    if(t!=='__new')return t;
    const sample=imp.rows.map(r=>r[j]).filter(v=>v!==''&&v!=null).slice(0,5);
    const isDate=sample.length&&sample.every(v=>v instanceof Date||toISO(v)&&typeof v!=='number');
    const c={key:'x_'+uid(),label:imp.headers[j],tipo:isDate?'date':'text',grupo:'otros',builtin:false,visible:true,lista:false};
    S.campos.push(c);return c.key;
  });
  keys.forEach(k=>{const c=campo(k);if(c&&c.builtin&&!c.visible)c.visible=true});
  if(imp.clear)S.empresas=S.empresas.filter(e=>!e.ejemplo);
  let added=0,updated=0,skipped=0,noname=0,faseUnk=0;
  const fuente=imp.file;
  imp.rows.forEach(r=>{
    const o={};
    keys.forEach((k,j)=>{
      if(!k)return;let v=r[j];
      if(v===''||v==null)return;
      const c=campo(k);
      if(k==='estado'){const f=matchFase(v);if(f)o.estado=f;else faseUnk++;return}
      if(k==='accionFecha'||(c&&c.tipo==='date')){const d=toISO(v);if(d)o[k]=d;return}
      if(c&&c.tipo==='number'){const n=parseInt(String(v).replace(/[^\d]/g,''),10);if(!isNaN(n))o[k]=n;return}
      if(c&&c.tipo==='ciclos'){
        const list=String(v).split(/[,;\/|+]|\s+y\s+|\s{2,}/).map(s=>s.trim().toUpperCase()).filter(Boolean);
        list.forEach(x=>{if(!(c.opciones||[]).includes(x))(c.opciones=c.opciones||[]).push(x)});
        o[k]=list;return;
      }
      o[k]=v instanceof Date?iso(v):String(v).trim();
    });
    if(!o.nombre){noname++;return}
    const ex=S.empresas.find(e=>norm(e.nombre)===norm(o.nombre));
    if(ex&&imp.dup==='skip'){skipped++;return}
    if(ex&&imp.dup==='update'){
      const prev=ex.estado;Object.assign(ex,o);
      if(o.estado&&o.estado!==prev)(ex.historial=ex.historial||[]).unshift({fecha:TODAY,texto:`${label(prev)} → ${label(o.estado)} (importado)`,sys:true});
      (ex.historial=ex.historial||[]).unshift({fecha:TODAY,texto:`Datos actualizados desde ${fuente}`,sys:true});
      updated++;return;
    }
    const e={id:uid(),nombre:'',estado:imp.fase,accion:'',accionFecha:'',motivo:'',historial:[{fecha:TODAY,texto:`Importada desde ${fuente}`,sys:true}],...o};
    if(!fase(e.estado))e.estado=imp.fase;
    if(isClosed(e.estado)){e.accion='';e.accionFecha=''}
    S.empresas.push(e);added++;
  });
  save();closeModal();fillCicloFilter();renderAll();
  const parts=[`${added} empresa${added===1?'':'s'} importada${added===1?'':'s'}`];
  if(updated)parts.push(`${updated} actualizada${updated===1?'':'s'}`);
  if(skipped)parts.push(`${skipped} ya existían`);
  if(noname)parts.push(`${noname} sin nombre`);
  if(faseUnk)parts.push(`${faseUnk} con fase desconocida (van a «${label(imp?.fase||primeraActiva())}»)`);
  toast(parts.join(' · '),5000);
}

function aiResultsHTML(){

    const dup=S.empresas.some(e=>norm(e.nombre)===norm(r.nombre));
    const src=/^https?:\/\//.test(r.fuente||'')?r.fuente:'';
    let host='';try{host=src?new URL(src).hostname.replace(/^www\./,''):''}catch(e){}
    return `<tr><td><input type="checkbox" data-aisel="${i}" ${ai.sel.has(i)?'checked':''} aria-label="Añadir ${esc(r.nombre)}"></td>
      <td><strong>${esc(r.nombre)}</strong>${dup?'<span class="tag-dup">Ya está en el embudo</span>':''}${r.motivo_encaje?`<div class="sub">${esc(r.motivo_encaje)}</div>`:''}</td>
      <td>${aiDatos(r)}</td>
      <td>${src?`<a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(host||'enlace')}</a>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`;
}
// Los campos que rellena la IA salen de la configuración actual (nombres, tipos, opciones y campos propios)
function aiCampos(){return S.campos.filter(c=>c.visible&&c.key!=='notas'&&c.key!=='ultimo')}
function toolEmp(){
  const props={nombre:{type:'string',description:'Nombre de la empresa'}};
  aiCampos().forEach(c=>{
    const d=c.label;
    if(c.tipo==='ciclos')props[c.key]={type:'array',items:{type:'string',enum:(c.opciones||[]).length?c.opciones:undefined},description:`${d}: elige de la lista los que encajen`};
    else if(c.tipo==='number')props[c.key]={type:'integer',description:d};
    else if(c.tipo==='date')props[c.key]={type:'string',description:`${d} (formato AAAA-MM-DD)`};
    else props[c.key]={type:'string',description:d+(c.tipo==='email'?' (email)':c.tipo==='tel'?' (teléfono)':c.tipo==='textarea'?' (texto largo)':'')};
  });
  Object.assign(props,{
    notas:{type:'string',description:'Otros datos útiles que no encajan en los campos anteriores'},
    motivo_encaje:{type:'string',description:'Una frase: por qué encaja para la FFE'},
    web:{type:'string',description:'Web de la empresa'},
    fuente:{type:'string',description:'URL de donde salen los datos'}
  });
  return {name:'guardar_empresas',description:`Guarda las empresas encontradas o extraídas (máximo ${AI_MAX}). Cada propiedad es un campo de la ficha del centro.`,input_schema:{type:'object',properties:{empresas:{type:'array',maxItems:AI_MAX,items:{type:'object',properties:props,required:['nombre']}}},required:['empresas']}};
}
function aiDatos(r){
  const out=aiCampos().map(c=>{let v=r[c.key];if(Array.isArray(v))v=v.join(', ');v=String(v??'').trim();return v?`<div class="sub"><b style="color:var(--ink);font-weight:500">${esc(c.label)}:</b> ${esc(v)}</div>`:''}).join('');
  return out||'<span class="sub">—</span>';
}
const aiTxt=w=>w
  ?{l:'Describe qué empresas buscas',p:'Ej.: empresas de desarrollo web en Pamplona que puedan acoger alumnado de DAW. La IA buscará en internet.'}
  :{l:'Pega el texto con los datos de las empresas',p:'Pega aquí un correo, una lista copiada de un PDF o el texto de una web. La IA solo usará lo que haya en este texto, sin buscar en internet.'};

    <div class="m-body">
      <div class="field"><label for="ai-q" id="ai-ql">${esc(aiTxt(ai.web).l)}</label>

  $('#ai-key').onclick=()=>openAIKey();

  $('#ai-all')?.addEventListener('change',ev=>{ai.sel=ev.target.checked?new Set(ai.res.map((_,i)=>i)):new Set();m.querySelectorAll('[data-aisel]').forEach(c=>c.checked=ev.target.checked);upd()});
  m.querySelectorAll('[data-aisel]').forEach(c=>c.onchange=()=>{const i=+c.dataset.aisel;if(c.checked)ai.sel.add(i);else ai.sel.delete(i);upd()});
  $('#ai-fase')?.addEventListener('change',ev=>ai.fase=ev.target.value);

async function callAPI(body,key,signal){
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  const j=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error((j&&j.error&&j.error.message)||('HTTP '+res.status));e.status=res.status;throw e}
  return j;
}
async function askAI(q,web,max,signal){
  const cfg=aiCfg();
  const ciclos=(campo('ciclos')?.opciones||[]).join(', ')||'SMR, ASIR, DAW, DAM';
  const ya=S.empresas.map(e=>e.nombre).filter(Boolean).slice(0,300).join('; ');
  const system=`Ayudas a un tutor de un centro de Formación Profesional en España a localizar empresas para la Formación en Empresa (FFE) de su alumnado. Ciclos del centro: ${ciclos}.
Reglas:
- Devuelve como máximo ${max} empresas (nunca más de ${AI_MAX}).
- Solo datos reales. Si no encuentras un dato (persona de contacto, teléfono, email), déjalo vacío. Nunca inventes ni deduzcas teléfonos, emails ni nombres de personas.
- ${web?'Usa la búsqueda web. Indica en «fuente» la URL de donde sacas los datos de cada empresa.':'No tienes acceso a internet: extrae únicamente lo que aparece en el texto del usuario.'}
- Rellena los campos de la ficha tal como los describe la herramienta guardar_empresas. Deja vacío cualquier campo que no puedas sacar de una fuente o del texto.
- En los campos de ciclos elige solo de la lista del centro los que encajen con la actividad de la empresa.
- No incluyas empresas que ya están en el embudo${ya?`: ${ya}`:''}.
- Al terminar, llama una sola vez a la herramienta guardar_empresas con todos los resultados (o con una lista vacía). No escribas el listado como texto.`;
  const tools=[toolEmp()];
  if(web)tools.unshift({type:'web_search_20250305',name:'web_search',max_uses:8,user_location:{type:'approximate',country:'ES',timezone:'Europe/Madrid'}});
  let messages=[{role:'user',content:q}],nudged=false;
  for(let i=0;i<8;i++){
    const r=await callAPI({model:cfg.model,max_tokens:16000,system,tools,messages},cfg.key,signal);
    const content=r.content||[];
    const tu=content.find(b=>b.type==='tool_use'&&b.name==='guardar_empresas');
    if(tu)return (tu.input&&Array.isArray(tu.input.empresas))?tu.input.empresas:[];
    if(r.stop_reason==='pause_turn'){
      const last=messages[messages.length-1];
      if(last.role==='assistant')last.content=last.content.concat(content);else messages=[...messages,{role:'assistant',content}];
      continue;
    }
    const txt=content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const mm=txt.match(/\[[\s\S]*\]/);
    if(mm){try{const a=JSON.parse(mm[0]);if(Array.isArray(a))return a}catch(e){}}
    if(nudged)return [];
    nudged=true;
    messages=[...messages,{role:'assistant',content},{role:'user',content:'Llama ahora a guardar_empresas con los resultados (o con una lista vacía si no hay ninguna).'}];
  }
  return [];
}
function aiErr(err){
  const msg=String(err&&err.message||'');
  if(err.status===429)return 'Has hecho demasiadas peticiones seguidas. Espera un minuto y vuelve a intentarlo.';
  if(err.status===529||err.status>=500)return 'El servicio de Claude está saturado ahora mismo. Inténtalo en unos minutos.';
  if(err.status===400&&/credit|balance/i.test(msg))return 'Tu cuenta de la API no tiene saldo. Añade crédito en la consola de Claude.';
  if(err.status===400&&/web.?search/i.test(msg))return 'La búsqueda web está desactivada en tu cuenta de la API. Actívala en la consola de Claude o desmarca «Buscar en internet».';
  if(err.status===403)return 'Tu clave no tiene permiso para usar este modelo. Prueba con otro en «Cambiar clave o modelo».';
  if(err.status===404)return 'El modelo elegido no está disponible. Elige otro en «Cambiar clave o modelo».';
  if(err.status)return 'La API ha respondido con un error: '+msg;
  return 'No se ha podido conectar con la API de Claude. Comprueba la conexión a internet.';
}
async function runAI(){
  const qv=($('#ai-q')?.value||'').trim();ai.q=qv;
  if(!qv){$('#ai-q')?.focus();return}
  ai.web=$('#ai-web').checked;ai.max=Math.max(1,Math.min(AI_MAX,parseInt($('#ai-max').value,10)||10));
  ai.status='loading';ai.err='';ai.res=[];ai.sel=new Set();renderAI();
  const ctrl=new AbortController();ai.ctrl=ctrl;
  try{
    let res=await askAI(qv,ai.web,ai.max,ctrl.signal);
    if(ai.ctrl!==ctrl)return;
    res=(Array.isArray(res)?res:[]).filter(r=>r&&String(r.nombre||'').trim()).slice(0,Math.min(ai.max,AI_MAX));
    ai.res=res;ai.sel=new Set(res.map((_,i)=>i).filter(i=>!S.empresas.some(e=>norm(e.nombre)===norm(res[i].nombre))));
    ai.status='done';
  }catch(err){
    if(ai.ctrl!==ctrl||err.name==='AbortError')return;
    if(err.status===401){ai.status='idle';ai.ctrl=null;if(modalKind==='ai')openAIKey('La clave no es válida o ha caducado. Escribe una nueva.');return}
    ai.status='error';ai.err=aiErr(err);
  }
  ai.ctrl=null;
  if(modalKind==='ai')renderAI();
  else if(ai.status==='done')toast(`La IA ha encontrado ${ai.res.length} empresa${ai.res.length===1?'':'s'}. Pulsa el botón de IA para revisarlas.`,5000);
}
function addAI(){
  const f=ai.fase&&fase(ai.fase)?ai.fase:primeraActiva(),closed=isClosed(f);
  const keep=ai.res.filter((_,i)=>ai.sel.has(i));if(!keep.length)return;
  const s=v=>String(v??'').trim();
  keep.forEach(r=>{
    const web=/^https?:\/\//.test(s(r.web))?s(r.web):'',src=/^https?:\/\//.test(s(r.fuente))?s(r.fuente):'';
    const notas=[s(r.motivo_encaje),s(r.localidad)&&`Localidad: ${s(r.localidad)}`,web&&`Web: ${web}`,src&&src!==web&&`Fuente: ${src}`].filter(Boolean).join('\n');
    const e={id:uid(),nombre:s(r.nombre),plazas:1,estado:f,ultimo:'',accion:closed?'':'Primera llamada',accionFecha:closed?'':TODAY,motivo:'',historial:[{fecha:TODAY,texto:'Añadida con IA'+(src?` · ${src}`:''),sys:true}]};
    aiCampos().forEach(c=>{
      const v=r[c.key];if(v==null||v===''||(Array.isArray(v)&&!v.length))return;
      if(c.tipo==='ciclos'){const o=c.opciones||[];e[c.key]=[...new Set((Array.isArray(v)?v:String(v).split(/[,;\/]/)).map(x=>o.find(y=>y.toUpperCase()===s(x).toUpperCase())).filter(Boolean))];return}
      if(c.tipo==='number'){const n=parseInt(String(v).replace(/[^\d]/g,''),10);if(!isNaN(n))e[c.key]=n;return}
      if(c.tipo==='date'){const d=toISO(v);if(d)e[c.key]=d;return}
      e[c.key]=Array.isArray(v)?v.map(s).join(', '):s(v);
    });
    const extra=[s(r.notas),notas].filter(Boolean).join('\n');
    if(extra){if(visible('notas'))e.notas=extra;else e.historial.push({fecha:TODAY,texto:extra,sys:true})}
    S.empresas.push(e);
  });
  save();const n=keep.length;ai.res=[];ai.sel=new Set();ai.status='idle';closeModal();renderAll();
  toast(`${n} empresa${n===1?'':'s'} añadida${n===1?'':'s'} a «${label(f)}»`,6000,UNDO);
}

// Enlace al formulario de Google con lo escrito ya rellenado
function fbPrefill(){
  const u=new URLSearchParams({usp:'pp_url'}),t=($('#fb-t')?.value||fb.texto||'').trim();
  if(t)u.append(FB.texto,t);if(fb.tipo)u.append(FB.tipo,fb.tipo);if(fb.nota)u.append(FB.nota,String(fb.nota));
  return FEEDBACK_URL+'?'+u.toString();
}
async function sendFeedback(){
  fb.texto=($('#fb-t')?.value||'').trim();
  if(!fb.tipo){renderFeedback('Elige el tipo de comentario.');return}
  if(!fb.texto){renderFeedback('Escribe tu comentario.');$('#fb-t')?.focus();return}
  fb.status='sending';renderFeedback();
  const body=new URLSearchParams();
  body.append(FB.texto,fb.texto);body.append(FB.tipo,fb.tipo);if(fb.nota)body.append(FB.nota,String(fb.nota));
  body.append('fvv','1');body.append('pageHistory','0');
  try{await fetch(FB.action,{method:'POST',mode:'no-cors',body})}
  catch(e){fb.status='idle';fb.failed=true;if(modalKind==='feedback')renderFeedback('No se ha podido enviar desde aquí. Pulsa «Terminar en Google Forms»: se abrirá con tu comentario ya escrito y solo tendrás que pulsar Enviar.');return}
  fb={texto:'',tipo:'',nota:'',status:'sent'};
  if(modalKind==='feedback')renderFeedback();else toast('Comentario enviado. ¡Gracias!');
}

/* ---------- Toast ---------- */
let toastT;
function toast(m,ms=2600,act){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(m)}</span>${act?`<button class="toast-btn">${esc(act.label)}</button>`:''}`;
  if(act)t.querySelector('button').onclick=()=>{t.hidden=true;act.fn()};
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);
}

/* ---------- Tooltips propios ---------- */
let tipEl=null,tipT;
function tipShow(el){
  const t=$('#tip');if(!el.isConnected||!el.dataset.tip)return;
  t.textContent=el.dataset.tip;t.hidden=false;
  const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
  let x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)),y=r.top-h-8;
  if(y<8)y=r.bottom+8;
  t.style.left=x+'px';t.style.top=y+'px';
}
function tipHide(){clearTimeout(tipT);tipEl=null;$('#tip').hidden=true}
function tipTarget(node){
  const el=node&&node.closest?node.closest('[title],[data-tip]'):null;
  if(el&&el.hasAttribute('title')){const v=el.getAttribute('title');el.removeAttribute('title');if(v)el.dataset.tip=v}
  return el&&el.dataset.tip?el:null;
}
document.addEventListener('pointerover',ev=>{
  const el=tipTarget(ev.target);if(el===tipEl)return;tipHide();
  if(!el||ev.pointerType==='touch')return;
  tipEl=el;tipT=setTimeout(()=>tipShow(el),450);
});
document.addEventListener('pointerout',ev=>{if(!ev.relatedTarget)tipHide()});
document.addEventListener('focusin',ev=>{
  const el=tipTarget(ev.target);tipHide();
  if(el&&ev.target.matches(':focus-visible')){tipEl=el;tipShow(el)}
});
['focusout','pointerdown','dragstart','scroll','keydown'].forEach(t=>document.addEventListener(t,tipHide,true));

/* ---------- Render general ---------- */
function fillCicloFilter(){
  const c=campo('ciclos'),sel=$('#fciclo');if(!sel)return;
  sel.hidden=!(c&&c.visible);
  sel.innerHTML=`<option value="">Todos los ciclos</option>`+((c&&c.opciones)||[]).map(o=>`<option ${o===fciclo?'selected':''}>${esc(o)}</option>`).join('');
}
function renderAll(){
  renderStats();
  $('#notice').hidden=!S.empresas.some(e=>e.ejemplo);
  $$('#tabs [data-cfgv]').forEach(b=>b.hidden=b.dataset.cfgv!==view);
  $$('#tabs a').forEach(a=>{if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  ({embudo:renderBoard,lista:renderList,agenda:renderAgenda})[view]();
}
function route(){const h=location.hash.slice(1);view=['embudo','lista','agenda'].includes(h)?h:(matchMedia('(max-width:640px)').matches?'agenda':'embudo');renderAll()}

/* ---------- Eventos globales ---------- */

$('#q').oninput=ev=>{q=ev.target.value;renderAll()};
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||'')?'⌘':'Ctrl+';
$('#undo').dataset.tip=`Deshacer (${MOD}Z)`;
$('#redo').dataset.tip=`Rehacer (${MOD==='⌘'?'⌘⇧Z':'Ctrl+Y'})`;
$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)||ev.altKey)return;
  const k=ev.key.toLowerCase();if(k!=='z'&&k!=='y')return;
  const t=ev.target;
  if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&!['checkbox','radio','button','file'].includes(t.type))))return;
  ev.preventDefault();if(k==='y'||ev.shiftKey)redo();else undo();
});
$('#importar').onclick=openImport;
addEventListener('scroll',()=>{const h=$('header.top'),y=scrollY;if(y>60)h.classList.add('stuck');else if(y<8)h.classList.remove('stuck')},{passive:true});
$('#qbtn').onclick=()=>{$('header.top').classList.add('qopen');$('#q').focus()};
$('#q').addEventListener('blur',()=>{if(!q.trim())$('header.top').classList.remove('qopen')});
